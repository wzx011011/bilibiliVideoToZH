<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国历史 · 舆图沙盘</title>
<style>
:root{--paper:#f4edda;--ink:#2c261b;--ink2:#5c4f36;--ink3:#8a7a55;--line:#cfc09a;
  --card:#faf4e4;--red:#a63a2e;--gold:#b5892f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
  font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  background:var(--paper)}
header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:13px;
  padding:9px 20px;background:linear-gradient(180deg,var(--paper) 55%,rgba(244,237,218,0))}
header .seal{width:42px;height:42px;background:var(--red);color:#f7efdc;border-radius:8px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  box-shadow:0 2px 8px rgba(166,58,46,.35)}
header h1{margin:0;font-size:20px;letter-spacing:1px}
header .sub{margin:2px 0 0;font-size:12px;color:var(--ink3)}
#year{margin-left:auto;text-align:right;line-height:1.05;pointer-events:none}
#year .num{font-size:34px;font-weight:700;color:var(--red)}
#year .lab{font-size:11px;color:var(--ink3)}
.ctrl{display:flex;gap:6px}
.ctrl button{font-family:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);
  color:var(--ink2);border-radius:8px;padding:5px 12px;cursor:pointer;min-width:34px;text-align:center}
.ctrl button:hover{border-color:var(--ink2)}
.ctrl button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#cv{display:block;width:100vw;height:100vh;cursor:crosshair}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 18px 12px;
  background:linear-gradient(0deg,var(--paper) 62%,rgba(244,237,218,0))}
#bar{position:relative;height:26px;cursor:pointer}
#bar .track{position:absolute;left:0;right:0;top:12px;height:3px;background:#d8c9a2;border-radius:2px}
#bar .fill{position:absolute;left:0;top:12px;height:3px;background:var(--red);border-radius:2px;width:0}
#bar .ev{position:absolute;top:8px;width:2px;height:11px;background:#b3a276}
#bar .ev.major{background:#8f7d52;height:15px;top:6px}
#cursor{position:absolute;top:3px;width:13px;height:19px;margin-left:-6.5px;background:var(--red);
  border-radius:3px;box-shadow:0 1px 4px rgba(120,30,20,.4);cursor:grab}
#dock .row{display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap}
#hint2{font-size:11.5px;color:var(--ink3);margin-left:auto}
.jumps{display:flex;gap:5px;flex-wrap:wrap}
.jumps button{font-family:inherit;font-size:11.5px;border:1px solid var(--line);background:transparent;
  color:var(--ink2);border-radius:12px;padding:2px 10px;cursor:pointer}
.jumps button:hover{color:var(--red);border-color:var(--red)}
#note{margin-left:auto;font-size:11px;color:var(--ink3);pointer-events:none}
#tip{position:fixed;display:none;z-index:30;background:#2f2a20;color:#f4edda;font-size:12px;
  padding:4px 10px;border-radius:6px;pointer-events:none;white-space:nowrap}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,94vw);z-index:40;background:#fbf6ea;
  border-left:1px solid #cbb98e;box-shadow:-8px 0 30px rgba(60,45,15,.25);transform:translateX(105%);
  transition:transform .22s ease;padding:22px 24px 30px;overflow-y:auto}
#drawer.open{transform:translateX(0)}
#drawer h2{margin:0 0 4px;font-size:24px}
#drawer .yrs{color:var(--red);font-size:13.5px;margin-bottom:12px}
#drawer p{margin:8px 0;font-size:14px;line-height:1.75;color:var(--ink2)}
.dclose{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--ink2);font-size:15px;cursor:pointer}
</style>
</head>

  <div class="ctrl">

    <button id="b-speed" title="播放速度">1×</button>
    <button id="b-index">事件索引</button>
    <button onclick="location.href='history_map.html'">时间轴 ↗</button>

  <div id="year"><div class="num">前 2070</div><div class="lab">当期: 夏</div></div>
</header>
<canvas id="cv"></canvas>
<div id="dock">

</div>

function alphaOf(s){
  const F=28;
  if(year<s.t0||year>s.t1)return 0;
  const a=Math.min(1,(year-s.t0)/F),b=Math.min(1,(s.t1-year)/F);
  return Math.min(a,b);
}
function area(poly){let a=0;for(let i=0;i<poly.length;i++){const j=(i+1)%poly.length;
  a+=poly[i][0]*poly[j][1]-poly[j][0]*poly[i][1];}return Math.abs(a/2);}
function centroid(poly){let x=0,y=0;for(const p of poly){x+=p[0];y+=p[1];}
  return [x/poly.length,y/poly.length];}

  b.strokeStyle='rgba(80,120,160,.42)';b.lineWidth=1.1;
  b.beginPath();
  for(const seg of NE.rivers){
    seg.forEach((pt,i)=>i?b.lineTo(px(pt[0]),py(pt[1])):b.moveTo(px(pt[0]),py(pt[1])));
  }
  b.stroke();
  _base=c;_baseW=W;return c;
}
let _land=null,_landW=0;
function landPath(){
  if(_land&&_landW===W)return _land;
  const p=new Path2D();
  for(const ring of NE.land){
    ring.forEach((pt,i)=>i?p.lineTo(px(pt[0]),py(pt[1])):p.moveTo(px(pt[0]),py(pt[1])));
    p.closePath();
  }
  _land=p;_landW=W;return p;
}
function polyPath(pts,close){pts.forEach((pt,i)=>i?ctx.lineTo(px(pt[0]),py(pt[1])):ctx.moveTo(px(pt[0]),py(pt[1])));if(close)ctx.closePath();}
function fillPoly(poly){ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(px(p[0]),py(p[1])):ctx.moveTo(px(p[0]),py(p[1])));ctx.closePath();ctx.fill();}
function strokePoly(poly,close=true){ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(px(p[0]),py(p[1])):ctx.moveTo(px(p[0]),py(p[1])));if(close)ctx.closePath();ctx.stroke();}

/* ================= 时间轴 UI ================= */
const bar=document.getElementById('bar'),fillEl=document.querySelector('#bar .fill'),
      cursor=document.getElementById('cursor'),yearEl=document.querySelector('#year .num'),
      yearLab=document.querySelector('#year .lab');
const yToX=y=>(y-Y0)/(Y1-Y0)*bar.clientWidth;
const xToY=x=>Y0+x/bar.clientWidth*(Y1-Y0);
function buildBar(){
  bar.querySelectorAll('.ev').forEach(e=>e.remove());
  for(const e of EV){
    const d=document.createElement('div');
    d.className='ev'+(e.j?' major':'');
    d.style.left=yToX(e.y)+'px';
    d.title=`${yl(e.y)} ${e.t}`;
    d.onclick=ev=>{ev.stopPropagation();setYear(e.y);pause();};
    bar.appendChild(d);
  }
}
function setYear(y){year=Math.max(Y0,Math.min(Y1,y));syncUI();}
function syncUI(){
  const x=yToX(year);
  fillEl.style.width=x+'px';cursor.style.left=x+'px';
  yearEl.textContent=yl(year);
  const cur=S.filter(s=>year>=s.t0&&year<=s.t1).map(s=>s.n);
  yearLab.textContent=cur.length?('当期: '+cur.join(' · ')):'—';
  draw();
}
let scrubbing=false;
bar.addEventListener('pointerdown',e=>{scrubbing=true;pause();setYear(xToY(e.clientX-bar.getBoundingClientRect().left));});
addEventListener('pointermove',e=>{
  if(scrubbing)setYear(xToY(e.clientX-bar.getBoundingClientRect().left));
});
addEventListener('pointerup',()=>scrubbing=false);

/* ================= 播放控制 ================= */
const bPlay=document.getElementById('b-play');
function pause(){playing=false;bPlay.textContent='▶';bPlay.classList.remove('on');}
function play(){playing=true;bPlay.textContent='⏸';bPlay.classList.add('on');}
bPlay.onclick=()=>playing?pause():play();
const SPEEDS=[[0.35,'0.5×'],[1,'1×'],[4,'4×']];let spi=1;
document.getElementById('b-speed').onclick=()=>{
  spi=(spi+1)%SPEEDS.length;speed=SPEEDS[spi][0];
  const b=document.getElementById('b-speed');b.textContent=SPEEDS[spi][1];
};
function loop(now){
  const dt=(now-last)/1000;last=now;
  if(playing){
    year+=dt*speed*(speed===0.35?8:15);
    if(year>=Y1){year=Y1;pause();}
    syncUI();
  }
  requestAnimationFrame(loop);
}
buildBar();syncUI();requestAnimationFrame(t=>{last=t;loop(t);});

/* ================= 跳转/互链 ================= */
document.getElementById('jumps').innerHTML=JUMPS.map(j=>`<button data-y="${j[1]}">${j[0]}</button>`).join('');
document.querySelectorAll('.jumps button[data-y]').forEach(b=>b.onclick=()=>{setYear(+b.dataset.y);pause();});

/* ================= 地图交互 ================= */
const tip=document.getElementById('tip'),drawer=document.getElementById('drawer');
cv.addEventListener('pointermove',e=>{
  const hit=pickAt(e.clientX,e.clientY);
  if(hit){tip.style.display='block';tip.textContent=`${hit.n}(${yl(hit.t0)}–${yl(hit.t1)})`;
    tip.style.left=Math.min(e.clientX+14,W-tip.offsetWidth-8)+'px';tip.style.top=(e.clientY+16)+'px';
    cv.style.cursor='pointer';}
  else{tip.style.display='none';cv.style.cursor='crosshair';}
});
cv.addEventListener('pointerup',e=>{
  const hit=pickAt(e.clientX,e.clientY);
  if(!hit)return;
  const a=alphaOf(hit);
  drawer.innerHTML=`<button class="dclose" onclick="closeDrawer()">✕</button>
  <h2 style="color:${ERAS[hit.c]}">${hit.n}</h2>
  <div class="yrs">${yl(hit.t0)} – ${yl(hit.t1)} · 约 ${hit.t1-hit.t0} 年</div>
  <p>${hit.b}</p>`;
  drawer.classList.add('open');
});
function closeDrawer(){drawer.classList.remove('open');}
function pickAt(mx,my){
  let best=null,bd=1e9;
  for(const p of picks){
    const dd=(mx-p.x)**2+(my-p.y)**2;
    if(dd<p.r*p.r&&dd<bd){bd=dd;best=p.s;}
  }
  return best;
}
</script>

<script src="history_knowledge.js"></script>
<script>
/* ============ 知识库:每个政权的都城/事件/人物/著作/经济/制度 ============ */
function jumpYear(y){
  setYear(y);pause();
  const yel=document.getElementById('year');
  yel.classList.remove('flash');void yel.offsetWidth;yel.classList.add('flash');
  document.getElementById('year').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function openDrawer(s){
  const k=K[s.id]||{},era={c:ERAS[s.c],n:({xq:"先秦",qh:"秦汉",wj:"魏晋南北朝",st:"隋唐",sg:"五代两宋",yu:"元",mg:"明",qg:"清",md:"近现代"})[s.c]||""};
  const ev=(k.events||[]).map(e=>{
    const canJump=typeof e[3]==='number';
    return `<div class="evt ${canJump?'jump':''}" ${canJump?`onclick="jumpYear(${e[3]})"`:''} title="${canJump?'点击跳到这一年的地图':''}">
      <span class="yy ${canJump?'':'na'}">${e[0]}</span>
      <span class="tt"><b>${e[1]}</b>${e[2]?' — '+e[2]:''}</span></div>`;
  }).join('')||'<div class="plain">—</div>';
  const pp=(k.people||[]).map((p,pi)=>`<div class="ppl" style="cursor:pointer" title="查看人物词条" onclick="openPerson('${s.id}',${pi})"><span class="nn">${p[0]}<small>${p[1]||''}</small></span><span class="dd">${p[2]||''}</span></div>`).join('')||'<div class="plain">—</div>';
  const bk=(k.books||[]).map(b=>`<div class="bk"><a target="_blank" rel="noopener" title="维基百科检索" href="https://zh.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(String(b[0]).replace(/[《》]/g,''))}"><b>${b[0]} ↗</b></a> — ${b[1]||''}</div>`).join('')||'<div class="plain">—</div>';
  drawer.innerHTML=`<button class="dclose" onclick="closeDrawer()">✕</button>
  <h2 style="color:${ERAS[s.c]}">${s.n}</h2>
  <div class="yrs">${yl(s.t0)} – ${yl(s.t1)} · 约 ${s.t1-s.t0} 年</div>
  <span class="cap" style="border:1px solid ${era.c}55;color:${era.c};background:${era.c}14">${era.n}</span>
  <span class="cap" style="margin-left:6px">都城:${k.cap||'—'}</span>
  <div class="sect">大势</div><p>${s.b}</p>
  <div class="sect">重大事件<span style="float:right;letter-spacing:0;text-transform:none;color:#b3a276">点击跳到当年舆图 ↦</span></div>${ev}
  <div class="sect">人物</div>${pp}
  <div class="sect">著作</div>${bk}
  <div class="sect">经济</div><div class="plain">${k.econ||'—'}</div>
  <div class="sect">制度</div><div class="plain">${k.sys||'—'}</div>
  <div class="foot">内容为纲要式简介,供探索索引;史实细节以《中国大百科全书·中国历史卷》及原始文献为准。
  <a href="history_map.html" style="color:var(--red)">在时间轴版查看制度脉络 →</a></div>`;
  drawer.classList.add('open');
}
/* ── 人物词条页 ── */
function openPerson(dynId, pi){
  const s=S.find(x=>x.id===dynId); if(!s)return;
  const k=K[dynId]||{}, p=(k.people||[])[pi]; if(!p)return;
  const evs=(k.events||[]).map(e=>{
    const canJump=typeof e[3]==='number';
    return `<div class="evt ${canJump?'jump':''}" ${canJump?`onclick="jumpYear(${e[3]})"`:''}>
      <span class="yy ${canJump?'':'na'}">${e[0]}</span>
      <span class="tt"><b>${e[1]}</b>${e[2]?' — '+e[2]:''}</span></div>`;
  }).join('')||'<div class="plain">—</div>';
  const peers=(k.people||[]).filter((_,i)=>i!==pi).map((q,qi)=>
    `<span class="peer" onclick="openPerson('${dynId}',${K[dynId].people.indexOf(q)})">${q[0]}·${q[1]||''}</span>`).join('')||'<span class="plain">本政权暂无其他收录人物</span>';
  drawer.innerHTML=`<button class="dclose" onclick="closeDrawer()">✕</button>
  <button class="backbtn" onclick="openDrawer(S.find(x=>x.id==='${dynId}'))">← 返回 ${s.n}</button>
  <h2 style="color:${ERAS[s.c]};margin-top:6px">${p[0]}</h2>
  <div class="yrs">${p[1]||''} · ${s.n}(${yl(s.t0)}–${yl(s.t1)})</div>
  <div class="sect">简介</div><div class="plain">${p[2]||'—'}</div>
  <div class="sect">同时代大事<span style="float:right;letter-spacing:0;color:#b3a276">点击跳到当年舆图 ↦</span></div>${evs}
  <div class="sect">同时代人物</div><div style="padding:2px 8px;line-height:2">${peers}</div>
  <div class="foot">简介为纲要式一句话;跳转后地图即该年份疆域。
  <a target="_blank" rel="noopener" style="color:var(--red)"
   href="https://zh.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(p[0])}">维基百科查 ${p[0]} ↗</a></div>`;
  drawer.classList.add('open');
}
/* ── 全历史事件总索引 ── */
function catOf(t){
  if(/之战|起义|兵变|北伐|东征|伐|灭|攻|战役|之乱|征/.test(t))return 'war';
  if(/变法|新政|改制|改革|法$|税|令|科举|释兵权|废丞相|治河|治邺|治蜀|汉化|纳土/.test(t))return 'sys';
  if(/书|经|诗|词|曲|历法|印刷|赋|大典|乐|字|纸|学宫|圆周率|染/.test(t))return 'cul';
  if(/盟|和议|条约|通西域|下西洋|开关|通商|来华|使/.test(t))return 'dip';
  if(/称帝|代汉|代唐|亡|统一|建立|迁都|起兵|入关|南渡|焚|自缢|颠覆/.test(t))return 'dyn';
  return 'oth';
}
const CATS=[['all','全部'],['dyn','政权更迭'],['war','战争与起义'],['sys','变法与制度'],['cul','文化著作'],['dip','外交经贸'],['oth','其他']];
const EIDX=[];
Object.keys(K).forEach(id=>{
  const s=S.find(x=>x.id===id); if(!s)return;
  (K[id].events||[]).forEach(e=>EIDX.push({id,y:e[0],num:(typeof e[3]==='number')?e[3]:null,
    t:e[1],d:e[2]||'',cat:catOf((e[1]||'')+(e[2]||'')),dn:s.n,dc:ERAS[s.c]}));
});
EIDX.sort((a,b)=>(a.num??9999)-(b.num??9999));
const ipanel=document.createElement('div');
ipanel.id='indexPanel';
ipanel.innerHTML=`<div class="ip-head"><b>全历史事件总索引</b><span style="color:var(--ink3);font-weight:400">共 ${EIDX.length} 条 · 点击行跳到当年舆图并打开政权详情</span>
  <button class="dclose" style="position:static;margin-left:auto" onclick="toggleIndex(false)">✕</button></div>
  <div class="ip-cats">${CATS.map(c=>`<button data-c="${c[0]}" class="${c[0]==='all'?'on':''}">${c[1]}</button>`).join('')}</div>
  <div class="ip-list"></div>`;
document.body.appendChild(ipanel);
function renderIndex(cat){
  const rows=EIDX.filter(e=>cat==='all'||e.cat===cat);
  ipanel.querySelector('.ip-list').innerHTML=rows.map(e=>
   `<div class="ip-row" onclick="jumpYear(${e.num});openDrawer(S.find(x=>x.id==='${e.id}'));toggleIndex(false)">
     <span class="yy ${e.num===null?'na':''}">${e.y}</span>
     <span class="dn" style="border-color:${e.dc}33;color:${e.dc}">${e.dn}</span>
     <span class="tt"><b>${e.t}</b>${e.d?' — '+e.d:''}</span></div>`).join('')
   ||'<div class="plain" style="padding:20px">该分类暂无条目</div>';
}
function toggleIndex(on){
  ipanel.classList.toggle('open',on);
  if(on)renderIndex('all');
}
ipanel.querySelector('.ip-cats').addEventListener('click',e=>{
  const b=e.target.closest('button[data-c]'); if(!b)return;
  ipanel.querySelectorAll('.ip-cats button').forEach(x=>x.classList.toggle('on',x===b));
  renderIndex(b.dataset.c);
});
document.getElementById('b-index').onclick=()=>toggleIndex(!ipanel.classList.contains('open'));
/* 跨页跳转:history_geo.html?y=-221 直达某年 */
{const m=location.search.match(/[?&]y=(-?\d+)/);if(m){setYear(parseInt(m[1],10));pause();}}
</script>
