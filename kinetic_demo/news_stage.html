<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden;
              background:#f2ede3;
              font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  .num { font-family:Consolas,"Courier New",monospace; }

  /* 顶部栏目导航 */
  #nav { position:absolute; z-index:9; top:0; left:0; right:0; height:86px;
         display:flex; background:#efe9dd; border-bottom:1px solid #ddd2bf; }
  #nav .tab { flex:1; display:flex; align-items:center; justify-content:center;
              font-size:28px; letter-spacing:4px; color:#8a7a5f;
              border-right:1px solid #ddd2bf; }
  #nav .tab.on { background:#c2410c; color:#fff7ec; font-weight:700;
                 box-shadow:inset 0 -6px 0 #7c2d12; }
  #pbar { position:absolute; z-index:9; top:0; left:0; width:1920px; height:6px;
          background:rgba(0,0,0,.08); }
  #pfill { height:100%; width:0;
           background:linear-gradient(90deg,#c2410c,#0f766e,#b45309); }

  /* 内容卡 */
  .scene { position:absolute; inset:86px 0 200px; display:none;
           align-items:center; justify-content:center; }
  #storyBox { width:1600px; }
  #stTitle { text-align:center; font-size:52px; line-height:1.3; font-weight:800; color:#c2410c;
             letter-spacing:2px; opacity:0; padding:0 30px; }
  #stTitle .num { color:#0f766e; }
  #cards { margin-top:38px; display:grid;
           grid-template-columns:1fr 1fr; gap:36px; }
  .ncard { background:#fbf8f1; border:1px solid #e2d8c3; border-radius:22px;
           padding:42px 46px; box-shadow:0 12px 34px rgba(90,70,40,.10);
           opacity:0; transform:translateY(44px); }
  .ncard .h { display:flex; align-items:center; gap:18px; }
  .ncard .g { width:56px; height:56px; border-radius:14px; display:flex;
              align-items:center; justify-content:center; font-size:30px;
              color:#fff; background:var(--ac,#c2410c); font-weight:800; }
  .ncard h3 { font-size:36px; color:#9a3412; letter-spacing:1px; }
  .ncard .d { margin-top:20px; font-size:29px; line-height:1.72; color:#3f3627; }
  .ncard .d b { color:#9a3412; }
  .ncard .d .kw { background:#efe4cf; border-radius:8px; padding:2px 12px;
                  color:#7c2d12; font-weight:600; }

  /* 底部字幕条 */
  #subwrap { position:absolute; z-index:9; left:0; top:872px; width:1920px;
             height:110px; text-align:center; }
  .cue { display:none; display:none; }
  .cue span { display:inline-block; background:#4a4034; color:#fff8ee;
              font-size:38px; font-weight:700; letter-spacing:1px;
              padding:16px 44px; border-radius:14px; }

  /* 底部时间轴 */
  #tl { position:absolute; z-index:9; left:0; right:0; bottom:0; height:98px;
        background:#efe9dd; border-top:1px solid #ddd2bf; display:flex;
        align-items:center; padding:0 18px; gap:10px; }
  .tlitem { flex:1; height:74px; border-radius:10px; background:#fbf8f1;
            border:1px solid #e2d8c3; display:flex; flex-direction:column;
            align-items:center; justify-content:center; overflow:hidden; }
  .tlitem .n { font-size:20px; color:#5f5340; letter-spacing:0;
               white-space:nowrap; max-width:100%; padding:0 8px;
               text-align:center; }
  .tlitem .s { width:60%; height:5px; border-radius:3px; margin-top:7px;
               background:#e0d5be; }
  .tlitem.done .s { background:#0f766e; }
  .tlitem.on { background:#c2410c; border-color:#7c2d12; }
  .tlitem.on .n { color:#fff7ec; font-weight:700; }
  .tlitem.on .s { background:rgba(255,247,236,.5); }
</style>
</head>
<body>
<div id="pbar"><div id="pfill"></div></div>
<div id="nav"></div>

<div class="scene" id="sc-story" style="display:flex">
  <div id="storyBox">
    <div id="stTitle"></div>
    <div id="cards"></div>
  </div>
</div>

<div id="subwrap"></div>
<div id="tl"></div>

<script>window.__DATA__=__DATA_JSON__;window.__CONTENT__=__CONTENT_JSON__;</script>
<script>
const DATA=window.__DATA__, C=window.__CONTENT__, SEGS=DATA.segments, DUR=DATA.duration;
const $=id=>document.getElementById(id);
const clamp01=v=>Math.max(0,Math.min(1,v));
const easeOut=k=>1-Math.pow(1-k,3);

/* 导航栏 */
$('nav').innerHTML=C.nav.map(t=>`<div class="tab">${t}</div>`).join('');
/* 时间轴 */
$('tl').innerHTML=C.stories.map((s,i)=>`
  <div class="tlitem" id="tl${i}"><div class="n">${s.short}</div><div class="s"></div></div>`).join('');
/* 字幕 */
const subwrap=$('subwrap'); const cues=[];
for(const seg of SEGS) for(const c of seg.cues){
  const div=document.createElement('div'); div.className='cue';
  div.innerHTML=`<span>${c.text}</span>`;
  subwrap.appendChild(div); cues.push({div,start:c.start,end:c.end});
}
let activeCue=null;
function drawSub(t){
  let hit=null;
  for(const c of cues) if(t>=c.start&&t<=c.end){hit=c;break;}
  if(hit!==activeCue){
    if(activeCue) activeCue.div.style.display='none';
    if(hit) hit.div.style.display='block';
    activeCue=hit;
  }
}

/* 每个故事的卡片 DOM(初始化一次,切故事时换内容) */
let curStory=-1;
function fillStory(i){
  if(i===curStory) return;
  curStory=i;
  const s=C.stories[i];
  document.documentElement.style.setProperty('--ac',s.accent);
  const tabs=[...document.querySelectorAll('#nav .tab')];
  tabs.forEach(t2=>t2.classList.toggle('on',t2.textContent===s.tag));
  $('stTitle').innerHTML=s.title;
  $('cards').innerHTML=s.cards.map(c=>`
    <div class="ncard"><div class="h"><div class="g">${c.g}</div>
      <h3>${c.t}</h3></div><div class="d">${c.d}</div></div>`).join('');
  const cards=[...$('cards').children];
  cards.forEach(c2=>{c2.style.opacity=0;c2.style.transform='translateY(44px)';});
  $('stTitle').style.opacity=0;
}

function sceneProg(t,seg){return clamp01((t-seg.start)/(seg.end-seg.start));}
window.renderFrame=function(t){
  const seg=pickSeg(t);
  if(seg){
    fillStory(seg.pos);
    const p=sceneProg(t,seg);
    const cards=[...$('cards').children];
    cards.forEach((c,i)=>{
      const k=clamp01((p-0.12-i*0.14)*2.6);
      c.style.opacity=k.toFixed(3);
      c.style.transform=`translateY(${(1-easeOut(k))*44}px)`;
    });
    $('stTitle').style.opacity=easeOut(clamp01(p*2.6)).toFixed(3);
    /* 时间轴状态 */
    C.stories.forEach((s,i)=>{
      const el=$('tl'+i); if(!el)return;
      el.classList.toggle('on',i===seg.pos);
      el.classList.toggle('done',i<seg.pos);
    });
    $('pfill').style.width=(t/DUR*100).toFixed(2)+'%';
  }
  drawSub(t);
};
function pickSeg(t){for(const s of SEGS)if(t>=s.start-0.2&&t<=s.end+0.45)return s;
  return t>=SEGS[SEGS.length-1].end?SEGS[SEGS.length-1]:null;}
document.fonts.ready.then(()=>{window.__READY__=true;});
renderFrame(0);
</script>
</body>
</html>
