<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#0a101e;
              font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  canvas#bg { position:absolute; inset:0; }
  .scene { position:absolute; inset:110px 120px 250px; display:none;
           align-items:center; justify-content:center; }

  /* 通用 */
  .num { font-family:Consolas,"Courier New",monospace; font-weight:700; }
  .chip { display:inline-block; padding:10px 26px; border-radius:999px;
          font-size:26px; letter-spacing:2px; border:2px solid var(--acc);
          color:var(--acc); background:rgba(255,255,255,.04); }

  /* s1 标题 */
  #sc-title .mark { font-size:150px; font-weight:800; text-align:center;
    background:linear-gradient(100deg,#e8f6ff 30%,var(--acc));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:2px; opacity:0; }
  #sc-title .sub { margin-top:38px; text-align:center; opacity:0; }
  #sc-title .chip { margin:0 14px; }

  /* s2 基本盘 */
  #sc-arch .wrap { display:flex; gap:90px; align-items:center; }
  #sc-arch .stats { width:560px; }
  .stat { margin-bottom:56px; }
  .stat .k { font-size:30px; color:rgba(255,255,255,.55); letter-spacing:3px; }
  .stat .v { font-size:96px; color:#fff; }
  .stat .v em { font-style:normal; font-size:44px; color:rgba(255,255,255,.6);
                margin-left:10px; }
  #archGrid { display:grid; grid-template-columns:repeat(30,22px);
              grid-auto-rows:22px; gap:7px; }
  #archGrid i { border-radius:5px; background:rgba(255,255,255,.07); }
  #archGrid i.on { background:var(--acc); box-shadow:0 0 12px var(--acc); }

  /* s3 对比 */
  #sc-evolve .box { width:1400px; }
  .cmp { margin-bottom:64px; }
  .cmp .head { display:flex; justify-content:space-between; font-size:32px;
               color:rgba(255,255,255,.75); margin-bottom:16px; }
  .barRow { position:relative; height:52px; border-radius:14px;
            background:rgba(255,255,255,.06); overflow:hidden; }
  .barPrev { position:absolute; inset:0 auto 0 0; width:100%;
             background:rgba(255,255,255,.13); border-radius:14px; }
  .barCur  { position:absolute; inset:0 auto 0 0; width:0;
             background:linear-gradient(90deg,var(--acc),
                       color-mix(in srgb,var(--acc) 55%,#fff));
             border-radius:14px; }
  .delta { position:absolute; right:26px; top:50%; transform:translateY(-50%);
           font-size:34px; color:#fff; opacity:0; }
  .cmpNote { font-size:28px; color:rgba(255,255,255,.5); text-align:right;
             opacity:0; margin-top:10px; }

  /* s4 技术 */
  #sc-tech .box { width:1560px; }
  #tokStrip { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  #tokStrip i { width:34px; height:44px; border-radius:7px;
                background:rgba(255,255,255,.08); }
  #tokStrip i.sweep { background:color-mix(in srgb,var(--acc) 45%,transparent); }
  #tokStrip i.focus { background:var(--acc); box-shadow:0 0 16px var(--acc);
                      transform:scale(1.18); }
  #ctxLine { margin-top:70px; }
  #ctxLabel { font-size:34px; color:#fff; text-align:center; letter-spacing:4px;
              margin-bottom:20px; opacity:0; }
  #ctxBar { height:26px; border-radius:13px; background:rgba(255,255,255,.08); }
  #ctxFill { height:100%; width:0; border-radius:13px;
             background:linear-gradient(90deg,#3b82f6,var(--acc)); }
  #ctxScale { display:flex; justify-content:space-between; margin-top:10px;
              font-size:20px; color:rgba(255,255,255,.35); }

  /* s5 性能 */
  #sc-perf .row { display:flex; gap:60px; }
  .pcard { width:480px; padding:56px 44px; border-radius:28px;
           background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.09);
           transform:translateY(50px); opacity:0; }
  .pcard h3 { font-size:30px; color:rgba(255,255,255,.55); font-weight:400;
              letter-spacing:2px; }
  .pcard .big { font-size:64px; color:#fff; margin-top:24px; line-height:1.25; }
  .pcard .big b { color:var(--acc); }
  .miniBar { margin-top:30px; height:14px; border-radius:7px;
             background:rgba(255,255,255,.08); position:relative; }
  .miniBar i { position:absolute; inset:0 auto 0 0; border-radius:7px;
               background:var(--acc); }

  /* s6 应用(browser) */
  #browser { width:1360px; height:560px; border-radius:18px; opacity:0;
             background:#111a2c; border:1px solid rgba(255,255,255,.12);
             overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  #brBar { height:54px; display:flex; align-items:center; gap:10px;
           padding:0 22px; background:rgba(255,255,255,.05); }
  #brBar b { width:16px; height:16px; border-radius:50%; }
  #brUrl { margin-left:18px; flex:1; height:32px; border-radius:9px;
           background:rgba(255,255,255,.08); font-size:20px; line-height:32px;
           padding:0 18px; color:rgba(255,255,255,.5);
           font-family:Consolas,monospace; }
  #brBody { display:flex; height:calc(100% - 54px); }
  #codePane { flex:1.2; padding:26px 30px; border-right:1px solid rgba(255,255,255,.09);
              font-family:Consolas,monospace; font-size:23px; line-height:1.85;
              color:rgba(220,235,255,.82); }
  #codePane div { white-space:pre; opacity:.25; }
  #codePane div.done { opacity:1; }
  #prevPane { flex:1; position:relative; }
  #prevPane::after { content:""; position:absolute; inset:18px; border-radius:12px;
                     border:3px dashed transparent; }
  #prevPane.watch::after { border-color:var(--acc);
                           box-shadow:0 0 24px color-mix(in srgb,var(--acc) 60%,transparent)
                                      inset; }
  #prevTag { position:absolute; top:26px; right:26px; font-size:22px;
             color:var(--acc); letter-spacing:2px; opacity:0; }

  /* s7 价格 */
  #sc-price .row { display:flex; gap:100px; }
  .frac { text-align:center; opacity:0; }
  .frac .cap { font-size:32px; color:rgba(255,255,255,.55); letter-spacing:3px; }
  .frac .n { font-size:170px; color:var(--acc); }
  .frac .n b { font-size:84px; color:#fff; }
  .frac .of { font-size:40px; color:rgba(255,255,255,.4); margin-top:-6px; }

  /* s8 类比(book) */
  #sc-book .wrap { display:flex; align-items:center; gap:70px; }
  .books { display:flex; gap:16px; transform:rotate(-4deg); opacity:0; }
  .book { width:74px; border-radius:6px 10px 10px 6px; position:relative; }
  .book::after { content:attr(data-label); position:absolute; left:50%; top:18px;
                 writing-mode:vertical-rl; transform:translateX(-50%);
                 color:rgba(255,255,255,.85); font-size:19px; letter-spacing:3px; }
  .arrowL { font-size:74px; color:var(--acc); opacity:0; }
  .jar { width:420px; height:380px; border:5px solid rgba(255,255,255,.25);
         border-radius:26px 26px 34px 34px; position:relative; }
  .jarFill { position:absolute; left:0; right:0; bottom:0; height:0;
             border-radius:21px 21px 29px 29px;
             background:linear-gradient(180deg,
                       color-mix(in srgb,var(--acc) 75%,#fff),var(--acc)); }
  .jarTag { position:absolute; left:0; right:0; bottom:16px; text-align:center;
            font-size:28px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .coin { position:absolute; right:-36px; top:-26px; width:118px; height:118px;
          border-radius:50%; background:radial-gradient(circle at 35% 30%,
          #ffe9b0,#f59e0b); color:#5b3600; font-size:44px; font-weight:800;
          display:flex; align-items:center; justify-content:center;
          box-shadow:0 14px 34px rgba(245,158,11,.4); opacity:0; }
  #bkNote { margin-top:44px; text-align:center; font-size:32px;
            color:rgba(255,255,255,.65); opacity:0; }

  /* s9 钱包 */
  #sc-wallet .box { width:1380px; }
  .quota { display:flex; align-items:center; gap:30px; margin-bottom:54px; }
  .quota .who { width:330px; font-size:32px; color:rgba(255,255,255,.75);
                text-align:right; }
  .cells { display:flex; gap:14px; }
  .cells i { width:170px; height:58px; border-radius:12px;
             background:rgba(255,255,255,.07); }
  .cells i.f { background:linear-gradient(180deg,
               color-mix(in srgb,var(--acc) 70%,#fff),var(--acc));
               box-shadow:0 0 16px color-mix(in srgb,var(--acc) 55%,transparent); }
  .wchips { display:flex; gap:26px; justify-content:center; margin-top:16px; }
  .wchips span { opacity:0; padding:14px 30px; border-radius:14px; font-size:29px;
                 background:rgba(255,255,255,.05);
                 border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);
                 color:#fff; }
  #relief { margin-top:58px; text-align:center; font-size:42px; color:#fff;
            opacity:0; }
  #relief em { font-style:normal; color:var(--acc); font-weight:800; }
  #relief s { color:rgba(255,255,255,.4); }

  /* s10 幕后 */
  #sc-meta .list { font-size:44px; line-height:2.2; text-align:left; }
  #sc-meta .li { opacity:0; letter-spacing:1px; }
  #sc-meta .li b { color:var(--acc); font-weight:800; margin-left:18px; }

  /* 字幕区 */
  #subwrap { position:absolute; z-index:9; left:0; top:895px; width:1920px;
             height:120px; text-align:center; }
  .cue { display:none; font-size:40px; font-weight:600; color:rgba(243,247,255,.93);
         letter-spacing:1px; text-shadow:0 2px 16px rgba(0,0,0,.85); }

  #brand { position:absolute; z-index:9; top:44px; left:64px; font-size:25px;
           letter-spacing:3px; color:rgba(255,255,255,.38); }
  #part { position:absolute; z-index:9; top:44px; right:64px; font-size:25px;
          letter-spacing:3px; color:rgba(255,255,255,.38); }
  #pbar { position:absolute; z-index:9; top:0; left:0; width:1920px; height:5px;
          background:rgba(255,255,255,.07); }
  #pfill { height:100%; width:0;
           background:linear-gradient(90deg,#38bdf8,#34d399,#fb923c); }
</style>
</head>
<body>
<canvas id="bg" width="1920" height="1080"></canvas>
<div id="pbar"><div id="pfill"></div></div>
<div id="brand"></div>
<div id="part"></div>

<div class="scene" id="sc-title">
  <div style="width:100%">
    <div class="mark"></div>
    <div class="sub" id="titleChips"></div>
  </div>
</div>
<div class="scene" id="sc-arch"><div class="wrap">
  <div class="stats">
    <div class="stat"><div class="k" id="archK1"></div>
      <div class="v num" id="archV1">0<em></em></div></div>
    <div class="stat"><div class="k" id="archK2"></div>
      <div class="v num" id="archV2">0<em></em></div></div>
  </div>
  <div id="archGrid"></div>
</div></div>
<div class="scene" id="sc-evolve"><div class="box" id="evolveBox"></div></div>
<div class="scene" id="sc-tech"><div class="box">
  <div id="tokStrip"></div>
  <div id="ctxLine">
    <div id="ctxLabel"></div>
    <div id="ctxBar"><div id="ctxFill"></div></div>
    <div id="ctxScale"></div>
  </div>
</div></div>
<div class="scene" id="sc-perf"><div class="row" id="perfRow"></div></div>
<div class="scene" id="sc-app"><div id="browser">
  <div id="brBar"><b style="background:#ff5f57"></b><b style="background:#febc2e"></b><b style="background:#28c840"></b>
    <span id="brUrl"></span></div>
  <div id="brBody">
    <div id="codePane"></div>
    <div id="prevPane"><div id="prevTag">◉</div></div>
  </div>
</div></div>
<div class="scene" id="sc-price"><div class="row" id="priceRow"></div></div>
<div class="scene" id="sc-summary"><div class="row" id="summaryRow"></div></div>
<div class="scene" id="sc-book"><div style="width:100%">
  <div class="wrap" style="justify-content:center">
    <div class="books" id="booksBox"></div>
    <div class="arrowL">➜</div>
    <div class="jar"><div class="jarFill" id="jarFill"></div>
      <div class="jarTag" id="jarTag"></div>
      <div class="coin" id="coin"></div></div>
  </div>
  <div id="bkNote"></div>
</div></div>
<div class="scene" id="sc-wallet"><div class="box" id="walletBox"></div></div>
<div class="scene" id="sc-meta"><div class="list" id="metaList"></div></div>

<div id="subwrap"></div>

<script>window.__DATA__ = __DATA_JSON__; window.__CONTENT__ = __CONTENT_JSON__;</script>
<script>
const DATA = window.__DATA__;
const C = window.__CONTENT__;
const SEGS = DATA.segments;
const DUR  = DATA.duration;

/* ── 工具 ── */
const $ = id => document.getElementById(id);
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a,b,k) => a + (b-a)*k;
const easeOut = k => 1 - Math.pow(1-k, 3);
function hash(n){ const s = Math.sin(n*127.1)*43758.5453; return s - Math.floor(s); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* ── 内容填充 ── */
$('brand').textContent = C.brand;
document.querySelector('#sc-title .mark').textContent = C.title.mark;
$('titleChips').innerHTML = C.title.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('');
$('archK1').textContent = C.arch.k1;
$('archV1').innerHTML = `0<em>${esc(C.arch.u1)}</em>`;
$('archK2').textContent = C.arch.k2;
$('archV2').innerHTML = `0<em>${esc(C.arch.u2)}</em>`;
/* evolve:两条对比 */
$('evolveBox').innerHTML = C.evolve.rows.map((r,i)=>`
  <div class="cmp">
    <div class="head"><span>${esc(r.label)}</span><span>${esc(r.range)}</span></div>
    <div class="barRow"><div class="barPrev"></div><div class="barCur" id="evBar${i}"></div>
      <div class="delta num" id="evDelta${i}"></div></div>
  </div>`).join('') + `<div class="cmpNote" id="evNote">${esc(C.evolve.note||'')}</div>`;
$('ctxLabel').textContent = C.tech.ctx_label;
$('ctxScale').innerHTML = C.tech.scale.map(s=>`<span>${esc(s)}</span>`).join('');
$('perfRow').innerHTML = C.perf.map((p,i)=>`
  <div class="pcard"><h3>${esc(p.h3)}</h3><div class="big">${p.big}</div>
    ${p.bar!=null?`<div class="miniBar"><i id="perfBar${i}" style="width:0%"></i></div>`:''}</div>`).join('');
$('brUrl').textContent = C.app.url;
const CODE = C.app.code;
const codePane=$('codePane');
CODE.forEach(l=>{const d=document.createElement('div'); d.innerHTML=l; codePane.appendChild(d);});
const clines=[...codePane.children];
$('prevTag').textContent = C.app.tag;
$('priceRow').innerHTML = C.price.map(f=>`
  <div class="frac"><div class="cap">${esc(f.cap)}</div>
    <div class="n num">${esc(f.n)}<b>/</b>${esc(f.d)}</div><div class="of">${esc(f.of)}</div></div>`).join('');
$('summaryRow').innerHTML = C.summary.map(s=>`
  <div class="pcard"><h3>${esc(s.h3)}</h3><div class="big">${s.big}</div></div>`).join('');
/* book:书脊标签/金币/说明 */
$('booksBox').innerHTML = [230,214,198].map((h,i)=>
  `<div class="book" style="height:${h}px;background:${['#1d4ed8','#0e7490','#7c3aed'][i]};margin-top:${i?-9:0}px" data-label="${esc(C.book.book_label)}"></div>`).join('');
$('coin').textContent = C.book.coin;
$('bkNote').textContent = C.book.note;
/* wallet */
const WNEW_N = C.wallet.new_cells;
$('walletBox').innerHTML = `
  <div class="quota"><div class="who">${esc(C.wallet.who1)}</div>
    <div class="cells" id="qOld"><i></i></div></div>
  <div class="quota"><div class="who">${esc(C.wallet.who2)}</div>
    <div class="cells" id="qNew">${'<i></i>'.repeat(WNEW_N)}</div></div>
  <div class="wchips">${C.wallet.chips.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
  <div id="relief">${C.wallet.relief}</div>`;
$('metaList').innerHTML = C.meta.map(m=>`<div class="li">${esc(m.k)} <b>${esc(m.v)}</b></div>`).join('');

/* ── 背景 ── */
const gl = $('bg').getContext('webgl', {antialias:false, preserveDrawingBuffer:true});
let U = {};
(function(){
  if(!gl) return;
  const F = `precision highp float;
  uniform vec2 u_res; uniform float u_time; uniform vec3 u_ca; uniform vec3 u_cb; uniform float u_mix;
  float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float n2(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
    return mix(mix(h(i),h(i+vec2(1.,0.)),u.x), mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),u.x), u.y); }
  float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<4;i++){ v+=a*n2(p); p=p*2.1+vec2(7.7,3.1); a*=.5;} return v; }
  void main(){ vec2 uv=gl_FragCoord.xy/u_res;
    vec2 q=vec2(fbm(uv*2.0+vec2(u_time*.02,0.)), fbm(uv*2.0+vec2(0.,u_time*.015)+5.2));
    float n=fbm(uv*2.6+q*1.4);
    vec3 base=mix(vec3(.028,.042,.078), vec3(.036,.030,.055), uv.y);
    vec3 acc=mix(u_ca,u_cb,u_mix);
    vec3 col=base + acc*pow(n,3.0)*0.30*(0.85+0.15*sin(u_time*.105));
    col *= 1.0 - .55*pow(length(uv-vec2(.5,.46))*1.06, 2.0);
    gl_FragColor=vec4(col,1.); }`;
  const src = F;
  const sh=(t,s)=>{const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){ console.error(gl.getShaderInfoLog(o)); } return o;};
  const pr=gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, src));
  gl.linkProgram(pr); gl.useProgram(pr);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'a'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ['u_res','u_time','u_ca','u_cb','u_mix'].forEach(k=>U[k]=gl.getUniformLocation(pr,k));
})();
function hex2rgb(x){ return [parseInt(x.slice(1,3),16)/255, parseInt(x.slice(3,5),16)/255, parseInt(x.slice(5,7),16)/255]; }
let accMix = 0;
function drawBG(t, curSeg){
  if(!gl) return;
  const ca = hex2rgb(curSeg.color);
  accMix += ((t >= curSeg.end - 0.6 ? 1 : 0) - accMix) * 0.12;
  const nxt = SEGS[Math.min(SEGS.indexOf(curSeg)+1, SEGS.length-1)];
  const cb = hex2rgb(nxt.color === curSeg.color ? '#ffffff' : nxt.color);
  gl.uniform2f(U.u_res,1920,1080);
  gl.uniform1f(U.u_time,t);
  gl.uniform3f(U.u_ca, ca[0],ca[1],ca[2]);
  gl.uniform3f(U.u_cb, cb[0],cb[1],cb[2]);
  gl.uniform1f(U.u_mix, clamp01(accMix));
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ── 字幕 ── */
const subwrap = $('subwrap');
const cues = [];
for(const seg of SEGS) for(const c of seg.cues){
  const div = document.createElement('div');
  div.className = 'cue';
  div.textContent = c.text;
  subwrap.appendChild(div);
  cues.push({div, start:c.start, end:c.end});
}
let activeCue=null;
function drawSub(t){
  let hit=null;
  for(const c of cues) if(t>=c.start && t<=c.end){hit=c;break;}
  if(hit!==activeCue){
    if(activeCue) activeCue.div.style.display='none';
    if(hit) hit.div.style.display='block';
    activeCue=hit;
  }
}

/* ── 场景元素 ── */
const scenes={}; document.querySelectorAll('.scene').forEach(e=>scenes[e.id.slice(3)]=e);
const grid=$('archGrid'), GCOLS=30, GROWS=8, GN=GCOLS*GROWS;
for(let i=0;i<GN;i++){grid.appendChild(document.createElement('i'));}
const gcells=[...grid.children];
const archV1=$('archV1'), archV2=$('archV2');
const strip=$('tokStrip'), TN=76;
for(let i=0;i<TN;i++)strip.appendChild(document.createElement('i'));
const tcells=[...strip.children];
const ctxLabel=$('ctxLabel'),ctxFill=$('ctxFill');
const qNewCells=[...$('qNew').children];
const wchips=[...document.querySelectorAll('.wchips span')], relief=$('relief');
const metas=[...document.querySelectorAll('#sc-meta .li')];
const fracs=[...document.querySelectorAll('.frac')];
const books=document.querySelector('.books'),arrowL=document.querySelector('.arrowL'),
      jar=document.querySelector('.jar'),jarFill=$('jarFill'),jarTag=$('jarTag'),
      coin=$('coin'),bkNote=$('bkNote');
const prevPane=$('prevPane'),prevTag=$('prevTag');

/* 场景动画数值(全部来自 CONTENT) */
const ARCH=[C.arch.v1_num, C.arch.v2_num], ARCH_R=C.arch.grid_ratio||0.06;
const EV=C.evolve.rows;  // [{from,to,delta_fmt}]

/* ── 场景绘制 ── */
function sceneProg(t,seg){ return clamp01((t-seg.start)/(seg.end-seg.start)); }

const PAINT={
 title(seg,p){
   const mark=document.querySelector('#sc-title .mark'), titleSub=$('titleChips');
   mark.style.opacity=easeOut(clamp01(p*2.4)).toFixed(3);
   mark.style.transform=`translateY(${(1-easeOut(clamp01(p*2.4)))*34}px)`;
   titleSub.style.opacity=clamp01((p-0.22)*3.2).toFixed(3);
 },
 arch(seg,p){
   archV1.firstChild.textContent=Math.round(ARCH[0]*easeOut(clamp01(p*1.6)));
   archV2.firstChild.textContent=Math.round(ARCH[1]*easeOut(clamp01(p*2.2)));
   const step=Math.floor(p*GN*1.7);
   for(let i=0;i<GN;i++){
     const on=hash(i*3.7+step*0.618)<ARCH_R && i/GN<p*2.4;
     gcells[i].className=on?'on':'';
   }
 },
 evolve(seg,p){
   EV.forEach((r,i)=>{
     const k=easeOut(clamp01(p*1.5-i*0.22));
     const cur=$('evBar'+i), dl=$('evDelta'+i);
     if(!cur) return;
     cur.style.width=(lerp(1,r.ratio,k)*100).toFixed(1)+'%';
     dl.style.opacity=clamp01((p-0.45-i*0.2)*4).toFixed(3);
     dl.textContent=r.delta;
   });
   const note=$('evNote');
   if(note) note.style.opacity=clamp01((p-0.7)*4).toFixed(3);
 },
 tech(seg,p){
   const pos=p*1.3*TN;
   for(let i=0;i<TN;i++){
     let cls='';
     if(i<pos && i>pos-TN*0.16) cls+='sweep';
     if([6,23,41,58,70].some(a=>i>=a&&i<a+3)&&pos>i+2) cls+=' focus';
     if(tcells[i].className!==cls)tcells[i].className=cls;
   }
   ctxLabel.style.opacity=clamp01((p-0.3)*4).toFixed(3);
   ctxFill.style.width=(easeOut(clamp01((p-0.3)/0.65))*100).toFixed(1)+'%';
 },
 perf(seg,p){
   const cards=[...$('perfRow').children];
   cards.forEach((c,i)=>{
     const k=clamp01((p-i*0.18)*2.2);
     c.style.opacity=k.toFixed(3);
     c.style.transform=`translateY(${(1-easeOut(k))*50}px)`;
     const bar=c.querySelector('.miniBar i');
     if(bar && C.perf[i] && C.perf[i].bar!=null)
       bar.style.width=(easeOut(clamp01((p-0.15-i*0.2)*1.8))*C.perf[i].bar).toFixed(1)+'%';
   });
 },
 app(seg,p){
   const br=scenes.app.firstElementChild;
   br.style.opacity=clamp01(p*4).toFixed(3);
   const nDone=Math.floor(clamp01(p*1.25)*clines.length);
   clines.forEach((l,i)=>l.className=i<nDone?'done':'');
   const watching=p>0.42&&p<0.78;
   prevPane.className=watching?'watch':'';
   prevTag.style.opacity=watching?(0.6+0.4*Math.sin(seg.start+p*34)).toFixed(2):0;
 },
 price(seg,p){
   fracs.forEach((f,i)=>{
     const k=easeOut(clamp01((p-i*0.2)*1.9));
     f.style.opacity=k.toFixed(3);
     f.style.transform=`scale(${(0.7+0.3*k).toFixed(3)})`;
   });
 },
 summary(seg,p){
   const cards=[...$('summaryRow').children];
   cards.forEach((c,i)=>{
     const k=easeOut(clamp01((p-0.08-i*0.22)*2.4));
     c.style.opacity=k.toFixed(3);
     c.style.transform=`translateY(${(1-k)*46}px)`;
   });
 },
 book(seg,p){
   books.style.opacity=clamp01(p*3).toFixed(3);
   arrowL.style.opacity=clamp01((p-0.18)*4).toFixed(3);
   jar.style.opacity=clamp01((p-0.3)*4).toFixed(3);
   const fill=easeOut(clamp01((p-0.35)/0.5));
   jarFill.style.height=(fill*86).toFixed(1)+'%';
   jarTag.textContent=fill>0.5?(C.book.jar_tag||'已装下'):C.book.jar_start||'';
   coin.style.opacity=clamp01((p-0.72)*5).toFixed(3);
   coin.style.transform=`translateY(${-(1-easeOut(clamp01((p-0.72)*3)))*46}px)`;
   bkNote.style.opacity=clamp01((p-0.78)*4).toFixed(3);
 },
 wallet(seg,p){
   qNewCells.forEach((c,i)=>{
     c.classList.toggle('f', p > 0.16+i*0.13 );
   });
   wchips.forEach((s,i)=>s.style.opacity=clamp01((p-0.45-i*0.14)*4).toFixed(3));
   relief.style.opacity=clamp01((p-0.72)*4).toFixed(3);
 },
 meta(seg,p){
   metas.forEach((l,i)=>{
     l.style.opacity=clamp01((p-0.1-i*0.17)*3.4).toFixed(3);
     l.style.transform=`translateX(${(1-easeOut(clamp01((p-0.1-i*0.17)*3.4)))*30}px)`;
   });
 },
};

let shown=null;
function pickSeg(t){
  for(const s of SEGS) if(t>=s.start-0.2 && t<=s.end+0.45) return s;
  return null;
}

window.renderFrame=function(t){
  const seg=pickSeg(t);
  const key=seg?seg.scene:null;
  const box=key||null;
  if(box!==shown){
    Object.entries(scenes).forEach(([k,e])=>e.style.display=(k===box)?'flex':'none');
    shown=box;
  }
  if(seg){
    document.documentElement.style.setProperty('--acc',seg.color);
    $('part').textContent=`PART ${seg.pos+1}/${SEGS.length} · ${seg.label}`;
    drawBG(t,seg);
    PAINT[seg.scene](seg,sceneProg(t,seg));
  }
  drawSub(t);
  $('pfill').style.width=(t/DUR*100).toFixed(2)+'%';
};
document.fonts.ready.then(()=>{window.__READY__=true;});
renderFrame(0);
</script>
</body>
</html>
