<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#120b1e;
              font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  canvas#dawn { position:absolute; inset:0; }
  .scene { position:absolute; inset:110px 120px 250px; display:none;
           align-items:center; justify-content:center; }
  .num { font-family:Consolas,"Courier New",monospace; font-weight:700; }
  .chip { display:inline-block; padding:10px 26px; border-radius:999px;
          font-size:26px; letter-spacing:2px; border:2px solid var(--acc);
          color:#ffe9d6; background:rgba(255,255,255,.05); }

  #sc-title .mark { font-size:150px; font-weight:800; text-align:center;
    background:linear-gradient(100deg,#fff6ea 30%,var(--acc));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:3px; opacity:0; }
  #sc-title .sub { margin-top:38px; text-align:center; opacity:0; }
  #sc-title .chip { margin:0 14px; }

  #sc-scale .wrap { display:flex; gap:100px; align-items:center; }
  #sc-scale .stats { width:600px; }
  .stat { margin-bottom:56px; }
  .stat .k { font-size:30px; color:rgba(255,255,255,.55); letter-spacing:3px; }
  .stat .v { font-size:104px; color:#fff; }
  .stat .v em { font-style:normal; font-size:42px; color:rgba(255,255,255,.55);
                margin-left:10px; }
  #flowGrid { display:grid; grid-template-columns:repeat(30,22px);
              grid-auto-rows:22px; gap:7px; }
  #flowGrid i { border-radius:7px; background:rgba(255,255,255,.06); }
  #flowGrid i.on { background:linear-gradient(135deg,#fbbf24,var(--acc));
                   box-shadow:0 0 12px var(--acc); }

  #sc-evolve .box { width:1380px; }
  .cmp { margin-bottom:64px; }
  .cmp .head { display:flex; justify-content:space-between; font-size:32px;
               color:rgba(255,255,255,.72); margin-bottom:16px; }
  .barRow { position:relative; height:52px; border-radius:14px;
            background:rgba(255,255,255,.07); overflow:hidden; }
  .barPrev { position:absolute; inset:0 auto 0 0; width:100%;
             background:rgba(255,255,255,.12); border-radius:14px; }
  .barCur { position:absolute; inset:0 auto 0 0; width:0; border-radius:14px;
            background:linear-gradient(90deg,#fbbf24,var(--acc)); }
  .delta { position:absolute; right:26px; top:50%; transform:translateY(-50%);
           font-size:34px; color:#fff; opacity:0; }
  .cmpNote { font-size:28px; color:rgba(255,255,255,.5); text-align:right;
             opacity:0; margin-top:10px; }

  /* 混合注意力:双轨编织 */
  #sc-attn .box { width:1500px; }
  #attnLabel { text-align:center; font-size:34px; color:#fff; letter-spacing:4px;
               margin-bottom:36px; opacity:0; }
  .lane { height:64px; border-radius:16px; background:rgba(255,255,255,.07);
          position:relative; overflow:hidden; margin-bottom:30px; }
  .lane .tag { position:absolute; left:24px; top:50%; transform:translateY(-50%);
               font-size:26px; color:rgba(255,255,255,.85); letter-spacing:3px;
               z-index:2; }
  .lane .fill { position:absolute; inset:0 auto 0 0; width:0; }
  #laneFull .fill { background:linear-gradient(90deg,#fbbf24,#fb7185); }
  #laneLinear .fill { background:linear-gradient(90deg,#a78bfa,#67e8f9); }
  #attnMerge { margin-top:44px; text-align:center; font-size:32px;
               color:rgba(255,255,255,.7); opacity:0; }
  #attnMerge b { color:var(--acc); }

  /* 榜单 */
  #sc-rank .box { width:1200px; }
  .lrow { display:flex; align-items:center; gap:34px; padding:30px 44px;
          border-radius:18px; margin-bottom:26px; background:rgba(255,255,255,.05);
          opacity:0; transform:translateX(-40px); }
  .lrow .pos { font-size:52px; font-family:Consolas,monospace; font-weight:700;
               width:70px; color:rgba(255,255,255,.5); }
  .lrow .nm { font-size:38px; color:#fff; flex:1; }
  .lrow .sc { font-size:30px; color:rgba(255,255,255,.5); }
  .lrow.me { border:2px solid var(--acc);
             background:color-mix(in srgb,var(--acc) 12%,rgba(255,255,255,.04)); }
  .lrow.me .pos, .lrow.me .nm b { color:var(--acc); }
  #rankNote { text-align:center; font-size:30px; color:rgba(255,255,255,.55);
              opacity:0; margin-top:12px; }

  /* 三模态 */
  #sc-modal .box { width:1400px; text-align:center; }
  #streams { display:flex; gap:60px; justify-content:center; margin-bottom:60px; }
  .stream { width:300px; padding:44px 30px; border-radius:22px;
            background:rgba(255,255,255,.05); opacity:0;
            border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);
            transform:translateY(40px); }
  .stream .g { font-size:56px; }
  .stream .t { font-size:30px; color:#fff; margin-top:18px; letter-spacing:3px; }
  #modalFuse { font-size:36px; color:#fff; opacity:0; letter-spacing:4px; }
  #modalFuse b { color:var(--acc); }

  /* 价格 */
  #sc-price .row { display:flex; gap:70px; }
  .ptag { width:380px; padding:46px 36px; border-radius:22px; text-align:center;
          background:rgba(255,255,255,.05); opacity:0;
          border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);
          transform:scale(.85); }
  .ptag .cap { font-size:28px; color:rgba(255,255,255,.6); letter-spacing:2px; }
  .ptag .val { font-size:76px; color:#fff; margin-top:20px; }
  .ptag .val b { color:var(--acc); font-size:40px; }
  .ptag .sub { font-size:26px; color:rgba(255,255,255,.45); margin-top:14px; }

  /* 小结 */
  #sc-summary .row { display:flex; gap:56px; }
  .scard { width:440px; padding:50px 42px; border-radius:24px;
           background:rgba(255,255,255,.05);
           border:1px solid rgba(251,191,36,.25);
           transform:translateY(46px); opacity:0; }
  .scard h3 { font-size:30px; color:rgba(255,255,255,.55); font-weight:400;
              letter-spacing:2px; }
  .scard .big { font-size:56px; color:#fff; margin-top:22px; line-height:1.3; }
  .scard .big b { color:var(--acc); }

  /* 体感:百科卷轴 */
  #sc-sense .wrap { display:flex; align-items:center; gap:70px;
                    justify-content:center; width:100%; }
  .scrolls { display:flex; gap:18px; opacity:0; }
  .scroll { width:120px; height:280px; border-radius:12px; position:relative;
            background:linear-gradient(180deg,#3b2a52,#241a3a);
            border:2px solid color-mix(in srgb,var(--acc) 45%,transparent); }
  .scroll::after { content:attr(data-label); position:absolute; left:50%; top:20px;
                   writing-mode:vertical-rl; transform:translateX(-50%);
                   color:rgba(255,240,220,.85); font-size:20px; letter-spacing:4px; }
  #senseJar { width:380px; height:340px; border:5px solid rgba(255,230,200,.3);
              border-radius:26px 26px 34px 34px; position:relative; }
  .jarFill2 { position:absolute; left:0; right:0; bottom:0; height:0;
              border-radius:21px 21px 29px 29px;
              background:linear-gradient(180deg,#ffe9c7,var(--acc)); }
  .jarTag2 { position:absolute; left:0; right:0; bottom:16px; text-align:center;
             font-size:28px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.7); }
  #senseCoin { position:absolute; right:-40px; top:-24px; width:110px; height:110px;
               border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff3d6,#f59e0b);
               color:#5b3600; font-size:40px; font-weight:800; display:flex;
               align-items:center; justify-content:center; opacity:0;
               box-shadow:0 14px 34px rgba(245,158,11,.4); }
  #senseNote { margin-top:44px; text-align:center; font-size:32px;
               color:rgba(255,255,255,.68); opacity:0; }

  /* 钱包 */
  #sc-wallet .box { width:1360px; }
  .quota { display:flex; align-items:center; gap:30px; margin-bottom:52px; }
  .quota .who { width:380px; font-size:31px; color:rgba(255,255,255,.75);
                text-align:right; }
  .cells { display:flex; gap:14px; }
  .cells i { width:160px; height:56px; border-radius:12px;
             background:rgba(255,255,255,.08); }
  .cells i.f { background:linear-gradient(180deg,#ffe9c7,var(--acc));
               box-shadow:0 0 16px color-mix(in srgb,var(--acc) 55%,transparent); }
  .wchips { display:flex; gap:26px; justify-content:center; margin-top:14px; }
  .wchips span { opacity:0; padding:14px 30px; border-radius:14px; font-size:29px;
                 background:rgba(255,255,255,.06);
                 border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);
                 color:#fff; }
  #relief { margin-top:52px; text-align:center; font-size:42px; color:#fff;
            opacity:0; }
  #relief em { font-style:normal; color:var(--acc); font-weight:800; }

  #sc-meta .list { font-size:44px; line-height:2.2; text-align:left; }
  #sc-meta .li { opacity:0; letter-spacing:1px; }
  #sc-meta .li b { color:var(--acc); font-weight:800; margin-left:18px; }

  #subwrap { position:absolute; z-index:9; left:0; top:895px; width:1920px;
             height:120px; text-align:center; }
  .cue { display:none; font-size:40px; font-weight:600; color:rgba(255,248,240,.94);
         letter-spacing:1px; text-shadow:0 2px 16px rgba(0,0,0,.85); }
  #brand { position:absolute; z-index:9; top:44px; left:64px; font-size:25px;
           letter-spacing:3px; color:rgba(255,255,255,.38); }
  #part { position:absolute; z-index:9; top:44px; right:64px; font-size:25px;
          letter-spacing:3px; color:rgba(255,255,255,.38); }
  #pbar { position:absolute; z-index:9; top:0; left:0; width:1920px; height:5px;
          background:rgba(255,255,255,.08); }
  #pfill { height:100%; width:0; background:linear-gradient(90deg,#fbbf24,#fb7185,#a78bfa); }
</style>
</head>
<body>
<canvas id="dawn" width="1920" height="1080"></canvas>
<div id="pbar"><div id="pfill"></div></div>
<div id="brand">QWEN3.8 · 通义千问 · 一口气看懂</div>
<div id="part"></div>

<div class="scene" id="sc-title">
  <div style="width:100%">
    <div class="mark">Qwen3.8</div>
    <div class="sub" id="titleChips"></div>
  </div>
</div>
<div class="scene" id="sc-scale"><div class="wrap">
  <div class="stats">
    <div class="stat"><div class="k">总参数量</div>
      <div class="v num"><span id="sV1">0</span><em>2.4T</em></div></div>
    <div class="stat"><div class="k">单 Token 激活</div>
      <div class="v num"><span id="sV2">0</span><em>B · 约4%</em></div></div>
  </div>
  <div id="flowGrid"></div>
</div></div>
<div class="scene" id="sc-evolve"><div class="box" id="evolveBox"></div></div>
<div class="scene" id="sc-attn"><div class="box">
  <div id="attnLabel">混合注意力 · 该精读时精读,该扫读时扫读</div>
  <div class="lane" id="laneFull"><div class="fill"></div><div class="tag">全注意力 · 精读</div></div>
  <div class="lane" id="laneLinear"><div class="fill"></div><div class="tag">线性注意力 · 扫读</div></div>
  <div id="attnMerge">联合优化 → <b>百万级上下文</b> 原生支持</div>
</div></div>
<div class="scene" id="sc-rank"><div class="box">
  <div id="rankList"></div>
  <div id="rankNote">第三方榜单 · 开源阵营第一次摸到王座边上</div>
</div></div>
<div class="scene" id="sc-modal"><div class="box">
  <div id="streams"></div>
  <div id="modalFuse">三模态 <b>一网推理</b></div>
</div></div>
<div class="scene" id="sc-price"><div class="row" id="priceRow"></div></div>
<div class="scene" id="sc-summary"><div class="row" id="summaryRow"></div></div>
<div class="scene" id="sc-sense">
  <div style="width:100%">
    <div class="wrap">
      <div class="scrolls" id="scrollsBox"></div>
      <div style="font-size:70px;color:var(--acc);opacity:0" id="sArrow">➜</div>
      <div id="senseJar"><div class="jarFill2" id="jarFill"></div>
        <div class="jarTag2" id="jarTag"></div>
        <div id="senseCoin"></div></div>
    </div>
    <div id="senseNote"></div>
  </div>
</div>
<div class="scene" id="sc-wallet"><div class="box" id="walletBox"></div></div>
<div class="scene" id="sc-meta"><div class="list" id="metaList"></div></div>

<div id="subwrap"></div>

<script>window.__DATA__=__DATA_JSON__;window.__CONTENT__=__CONTENT_JSON__;</script>
<script>
const DATA=window.__DATA__, C=window.__CONTENT__, SEGS=DATA.segments, DUR=DATA.duration;
const $=id=>document.getElementById(id);
const clamp01=v=>Math.max(0,Math.min(1,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const easeOut=k=>1-Math.pow(1-k,3);
function hash(n){const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

$('brand').textContent=C.brand;
document.querySelector('#sc-title .mark').textContent=C.title.mark;
$('titleChips').innerHTML=C.title.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('');
$('evolveBox').innerHTML=C.evolve.rows.map((r,i)=>`
  <div class="cmp">
    <div class="head"><span>${esc(r.label)}</span><span>${esc(r.range)}</span></div>
    <div class="barRow"><div class="barPrev"></div><div class="barCur" id="evBar${i}"></div>
      <div class="delta num" id="evDelta${i}"></div></div>
  </div>`).join('')+`<div class="cmpNote" id="evNote">${esc(C.evolve.note||'')}</div>`;
$('rankList').innerHTML=C.rank.map(r=>`
  <div class="lrow ${r.me?'me':''}"><div class="pos">${esc(r.pos)}</div>
    <div class="nm">${r.nm}</div><div class="sc">${esc(r.sc||'')}</div></div>`).join('');
$('streams').innerHTML=C.modal.map(m=>`
  <div class="stream"><div class="g">${m.g}</div><div class="t">${esc(m.t)}</div></div>`).join('');
$('priceRow').innerHTML=C.price.map(p=>`
  <div class="ptag"><div class="cap">${esc(p.cap)}</div>
    <div class="val">${esc(p.val)}<b> ${esc(p.unit||'')}</b></div>
    <div class="sub">${esc(p.sub||'')}</div></div>`).join('');
$('scrollsBox').innerHTML=C.sense.scrolls.map((lb,i)=>
  `<div class="scroll" data-label="${esc(lb)}" style="height:${300-i*22}px"></div>`).join('');
$('senseCoin').textContent=C.sense.coin;
$('senseNote').textContent=C.sense.note;
$('walletBox').innerHTML=`
  <div class="quota"><div class="who">${esc(C.wallet.who1)}</div>
    <div class="cells"><i></i></div></div>
  <div class="quota"><div class="who">${esc(C.wallet.who2)}</div>
    <div class="cells" id="qNew">${'<i></i>'.repeat(C.wallet.new_cells)}</div></div>
  <div class="wchips">${C.wallet.chips.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
  <div id="relief">${C.wallet.relief}</div>`;
$('metaList').innerHTML=C.meta.map(m=>`<div class="li">${esc(m.k)} <b>${esc(m.v)}</b></div>`).join('');

/* 黎明绸缎背景:多层正弦丝带,暖金→紫罗兰 */
const dawn=$('dawn').getContext('2d');
function drawDawn(t,accHex){
  dawn.fillStyle='#120b1e'; dawn.fillRect(0,0,1920,1080);
  const acc=hex2rgb(accHex||'#fbbf24');
  const ribbons=[
    {y:.28,a:.16,c:[251,191,36],sp:.012,ph:0,amp:90},
    {y:.46,a:.13,c:[167,139,250],sp:.02,ph:2.1,amp:120},
    {y:.66,a:.15,c:[251,113,133],sp:.016,ph:4.2,amp:100},
    {y:.85,a:.11,c:[103,232,249],sp:.024,ph:1.2,amp:80},
  ];
  for(const rb of ribbons){
    dawn.beginPath();
    dawn.moveTo(0,1080);
    for(let x=0;x<=1920;x+=32){
      const y=1080*rb.y+Math.sin(x*.004+t*rb.sp+rb.ph)*rb.amp
             +Math.sin(x*.0013-t*rb.sp*.6+rb.ph*2)*rb.amp*.6;
      dawn.lineTo(x,y);
    }
    dawn.lineTo(1920,1080); dawn.closePath();
    const g=dawn.createLinearGradient(0,0,0,1080);
    g.addColorStop(0,`rgba(${rb.c[0]},${rb.c[1]},${rb.c[2]},${rb.a})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    dawn.fillStyle=g; dawn.fill();
  }
  /* 中心暗角聚焦 */
  const vg=dawn.createRadialGradient(960,470,300,960,540,1100);
  vg.addColorStop(0,'rgba(10,6,20,.55)'); vg.addColorStop(1,'rgba(10,6,20,.1)');
  dawn.fillStyle=vg; dawn.fillRect(0,0,1920,1080);
}
function hex2rgb(x){return [parseInt(x.slice(1,3),16)/255,parseInt(x.slice(3,5),16)/255,parseInt(x.slice(5,7),16)/255];}

/* 字幕 */
const subwrap=$('subwrap'); const cues=[];
for(const seg of SEGS) for(const c of seg.cues){
  const div=document.createElement('div'); div.className='cue'; div.textContent=c.text;
  subwrap.appendChild(div); cues.push({div,start:c.start,end:c.end});
}
let activeCue=null;
function drawSub(t){
  let hit=null;
  for(const c of cues) if(t>=c.start&&t<=c.end){hit=c;break;}
  if(hit!==activeCue){
    if(activeCue) activeCue.div.style.display='none';
    if(hit) hit.div.style.display='block';
    activeCue=hit;
  }
}

const scenes={}; document.querySelectorAll('.scene').forEach(e=>scenes[e.id.slice(3)]=e);
const gcells=(()=>{const g=$('flowGrid');for(let i=0;i<240;i++)g.appendChild(document.createElement('i'));return [...g.children];})();
const qNewCells=[...$('qNew').children];
const wchips=[...document.querySelectorAll('.wchips span')], relief=$('relief');
const metas=[...document.querySelectorAll('#sc-meta .li')];

function sceneProg(t,seg){return clamp01((t-seg.start)/(seg.end-seg.start));}
const EV=C.evolve.rows;

const PAINT={
 title(seg,p){
   const mark=document.querySelector('#sc-title .mark'),sub=$('titleChips');
   mark.style.opacity=easeOut(clamp01(p*2.4)).toFixed(3);
   mark.style.transform=`translateY(${(1-easeOut(clamp01(p*2.4)))*34}px)`;
   sub.style.opacity=clamp01((p-0.22)*3.2).toFixed(3);
 },
 scale(seg,p){
   $('sV1').textContent=Math.round(C.scale.v1*easeOut(clamp01(p*1.6)));
   $('sV2').textContent=Math.round(C.scale.v2*easeOut(clamp01(p*2.2)));
   const step=Math.floor(p*240*1.7);
   for(let i=0;i<240;i++){
     const on=hash(i*3.7+step*0.618)<C.scale.ratio && i/240<p*2.4;
     gcells[i].className=on?'on':'';
   }
 },
 evolve(seg,p){
   EV.forEach((r,i)=>{
     const k=easeOut(clamp01(p*1.5-i*0.22));
     const cur=$('evBar'+i),dl=$('evDelta'+i);
     if(!cur)return;
     cur.style.width=(lerp(1,r.ratio,k)*100).toFixed(1)+'%';
     dl.style.opacity=clamp01((p-0.45-i*0.2)*4).toFixed(3);
     dl.textContent=r.delta;
   });
   const note=$('evNote'); if(note)note.style.opacity=clamp01((p-0.7)*4).toFixed(3);
 },
 attn(seg,p){
   $('attnLabel').style.opacity=clamp01(p*3).toFixed(3);
   const f=$('laneFull').querySelector('.fill');
   const l=$('laneLinear').querySelector('.fill');
   /* 精读:分段点亮(锚点块);扫读:连续波扫 */
   const fp=clamp01((p-0.15)/0.7);
   f.style.width=(fp*100).toFixed(1)+'%';
   f.style.background=`repeating-linear-gradient(90deg,#fbbf24 0 46px,rgba(251,191,36,.25) 46px 64px)`;
   f.style.backgroundSize=`${100/fp}% 100%`;
   const lp=clamp01((p-0.35)/0.55);
   l.style.width=(lp*100).toFixed(1)+'%';
   $('attnMerge').style.opacity=clamp01((p-0.7)*4).toFixed(3);
 },
 rank(seg,p){
   const rows=[...$('rankList').children];
   rows.forEach((r,i)=>{
     const k=clamp01((p-0.08-i*0.16)*2.6);
     r.style.opacity=k.toFixed(3);
     r.style.transform=`translateX(${(1-easeOut(k))*(-40)}px)`;
   });
   $('rankNote').style.opacity=clamp01((p-0.66)*4).toFixed(3);
 },
 modal(seg,p){
   const ss=[...$('streams').children];
   ss.forEach((s,i)=>{
     const k=clamp01((p-i*0.14)*2.4);
     s.style.opacity=k.toFixed(3);
     s.style.transform=`translateY(${(1-easeOut(k))*40}px)`;
   });
   $('modalFuse').style.opacity=clamp01((p-0.5)*4).toFixed(3);
 },
 price(seg,p){
   const tags=[...$('priceRow').children];
   tags.forEach((t2,i)=>{
     const k=clamp01((p-i*0.18)*2.3);
     t2.style.opacity=k.toFixed(3);
     t2.style.transform=`scale(${(0.85+0.15*easeOut(k)).toFixed(3)})`;
   });
 },
 summary(seg,p){
   const cards=[...$('summaryRow').children];
   cards.forEach((c,i)=>{
     const k=easeOut(clamp01((p-0.08-i*0.22)*2.4));
     c.style.opacity=k.toFixed(3);
     c.style.transform=`translateY(${(1-k)*46}px)`;
   });
 },
 sense(seg,p){
   const sc=$('scrollsBox'); sc.style.opacity=clamp01(p*3).toFixed(3);
   $('sArrow').style.opacity=clamp01((p-0.18)*4).toFixed(3);
   $('jarFill').style.height=(easeOut(clamp01((p-0.35)/0.5))*86).toFixed(1)+'%';
   $('jarTag').textContent=p>0.5?C.sense.jar_tag:C.sense.jar_start;
   const coin=$('senseCoin');
   coin.style.opacity=clamp01((p-0.7)*5).toFixed(3);
   coin.style.transform=`translateY(${-(1-easeOut(clamp01((p-0.7)*3)))*40}px)`;
   $('senseNote').style.opacity=clamp01((p-0.75)*4).toFixed(3);
 },
 wallet(seg,p){
   qNewCells.forEach((c,i)=>c.classList.toggle('f',p>0.16+i*0.13));
   wchips.forEach((s,i)=>s.style.opacity=clamp01((p-0.45-i*0.14)*4).toFixed(3));
   relief.style.opacity=clamp01((p-0.72)*4).toFixed(3);
 },
 meta(seg,p){
   metas.forEach((l,i)=>{
     const k=clamp01((p-0.1-i*0.17)*3.4);
     l.style.opacity=k.toFixed(3);
     l.style.transform=`translateX(${(1-easeOut(k))*30}px)`;
   });
 },
};

let shown=null;
function pickSeg(t){for(const s of SEGS)if(t>=s.start-0.2&&t<=s.end+0.45)return s;return null;}
window.renderFrame=function(t){
  const seg=pickSeg(t); const key=seg?seg.scene:null;
  if(key!==shown){
    Object.entries(scenes).forEach(([k,e])=>e.style.display=(k===key)?'flex':'none');
    shown=key;
  }
  if(seg){
    document.documentElement.style.setProperty('--acc',seg.color);
    $('part').textContent=`PART ${seg.pos+1}/${SEGS.length} · ${seg.label}`;
    drawDawn(t,seg.color);
    PAINT[seg.scene](seg,sceneProg(t,seg));
  } else drawDawn(t,'#fbbf24');
  drawSub(t);
  $('pfill').style.width=(t/DUR*100).toFixed(2)+'%';
};
document.fonts.ready.then(()=>{window.__READY__=true;});
renderFrame(0);
</script>
</body>
