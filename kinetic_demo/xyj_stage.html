<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden;
              font-family:"STKaiti","KaiTi","Microsoft YaHei",serif; }
  #subwrap { position:absolute; z-index:9; left:0; bottom:56px; width:1920px;
             text-align:center; height:90px; }
  .cue { display:none; font-size:38px; color:#2f2a22; letter-spacing:2px;
         text-shadow:0 0 18px rgba(247,242,230,.9); }
  #brand { position:absolute; z-index:9; top:44px; left:64px; font-size:26px;
           letter-spacing:6px; color:rgba(60,50,35,.5); }
  #part { position:absolute; z-index:9; top:44px; right:64px; font-size:26px;
          letter-spacing:3px; color:rgba(60,50,35,.5); }
  #pbar { position:absolute; z-index:9; top:0; left:0; width:1920px; height:6px;
          background:rgba(0,0,0,.07); }
  #pfill { height:100%; width:0; background:linear-gradient(90deg,#8a7a5f,#c0392b,#1c1813); }
</style>
</head>
<body>
<svg id="sc" width="1920" height="1080" viewBox="0 0 1920 1080"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#f7f2e6"/>
      <stop offset="70%" stop-color="#efe7d3"/>
      <stop offset="100%" stop-color="#e6dcc4"/>
    </radialGradient>
    <filter id="inkblur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="inkblur2"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.35 0 0 0 0 0.32 0 0 0 0 0.26 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#paper)"/>

  <!-- 共享底景:红日/远山/云(各幕按需显隐) -->
  <g id="bgSun"><circle cx="1470" cy="290" r="140" fill="#c0392b"
      opacity="0.9" filter="url(#inkblur2)"/></g>
  <g id="bgClouds" stroke="#4a4238" stroke-width="5" fill="#efe7d3"
     opacity="0.8" filter="url(#inkblur2)">
    <path d="M170,300 q60,-70 140,-40 q40,-60 120,-30 q70,20 50,70
             q80,-10 70,50 l-330,10 q-60,-20 -50,-60 z"/>
    <path d="M1250,160 q50,-55 110,-30 q35,-45 95,-20 q55,18 40,55
             q60,-5 52,40 l-260,8 q-48,-16 -37,-53 z"/>
  </g>
  <g id="bgHillsFar" filter="url(#inkblur)">
    <path d="M0,700 Q240,540 480,660 Q700,760 900,640 Q1150,500 1400,680
             Q1650,830 1920,690 L1920,1080 L0,1080 Z"
          fill="#a49c8a" opacity="0.5"/>
  </g>
  <g id="bgHillsMid" filter="url(#inkblur)">
    <path d="M0,800 Q320,640 640,780 Q960,900 1280,760 Q1560,650 1920,800
             L1920,1080 L0,1080 Z"
          fill="#7d7563" opacity="0.6"/>
  </g>

  <!-- 幕0:题头 -->
  <g id="sg-title">
    <text x="1640" y="150" font-size="110" fill="#2a251d" writing-mode="tb"
          letter-spacing="18" opacity="0.92" id="ttMark">大闹天宫</text>
    <rect x="1592" y="640" width="78" height="78" fill="#c0392b" opacity="0.9"/>
    <text x="1608" y="694" font-size="36" fill="#f7f2e6">西游记</text>
    <text x="960" y="560" font-size="44" fill="#4a4238" text-anchor="middle"
          opacity="0" id="ttSub">上回说到,石猴出世,拜师学艺。这一回——</text>
  </g>

  <!-- 幕1:龙宫夺宝 -->
  <g id="sg-dragon" opacity="0">
    <g stroke="#2f2a22" fill="none" stroke-width="7" opacity="0.9">
      <path d="M0,760 q80,-46 160,0 t160,0 t160,0 t160,0 t160,0 t160,0
               t160,0 t160,0 t160,0 t160,0 t160,0 t160,0"/>
      <path d="M0,850 q80,-46 160,0 t160,0 t160,0 t160,0 t160,0 t160,0
               t160,0 t160,0 t160,0 t160,0 t160,0 t160,0" opacity="0.6"/>
    </g>
    <circle cx="960" cy="430" r="120" fill="#d4a017" opacity="0.4"
            filter="url(#glow)"/>
    <rect x="946" y="240" width="28" height="380" rx="14" fill="#1c1813"/>
    <rect x="938" y="230" width="44" height="42" rx="9" fill="#1c1813"/>
    <rect x="938" y="588" width="44" height="42" rx="9" fill="#1c1813"/>
    <text x="1030" y="330" font-size="34" fill="#7c2d12"
          writing-mode="tb" letter-spacing="8">定海神针 · 一万三千五百斤</text>
  </g>

  <!-- 幕2:弼马温之怒 -->
  <g id="sg-gate" opacity="0">
    <g fill="#3b352c" filter="url(#inkblur2)">
      <rect x="700" y="240" width="40" height="330"/>
      <rect x="1180" y="240" width="40" height="330"/>
      <rect x="660" y="200" width="600" height="46" rx="8"/>
      <path d="M640,200 q320,-90 640,0 l-30,26 q-290,-76 -580,0 z"/>
      <rect x="930" y="330" width="60" height="240"/>
    </g>
    <text x="960" y="300" font-size="44" fill="#efe7d3" text-anchor="middle"
          letter-spacing="14">南 天 门</text>
    <g transform="rotate(-18 900 780)">
      <path d="M820,760 a80,44 0 0,1 160,0 z" fill="#1c1813"/>
      <rect x="790" y="752" width="90" height="12" rx="6"/>
      <rect x="922" y="752" width="90" height="12" rx="6"/>
    </g>
    <text x="960" y="920" font-size="36" fill="#9a3412" text-anchor="middle"
          opacity="0.9">弼马温?—— 玉帝,你敢耍俺老孙!</text>
  </g>

  <!-- 幕3:齐天大圣旗 -->
  <g id="sg-flag" opacity="0">
    <rect x="560" y="240" width="18" height="620" fill="#1c1813"/>
    <path d="M578,260 q280,-40 520,10 q-40,120 10,240 q-260,-56 -530,-4 z"
          fill="#c0392b" opacity="0.94"/>
    <text x="700" y="420" font-size="86" fill="#f7f2e6" letter-spacing="10"
          font-weight="700">齐天大圣</text>
    <text x="700" y="500" font-size="30" fill="#f7f2e6" opacity="0.85"
          letter-spacing="6">玉帝 enroll 失败 · 自立门户</text>
  </g>

  <!-- 幕4:蟠桃园 -->
  <g id="sg-peach" opacity="0">
    <path d="M200,760 q300,-160 700,-140 q400,20 820,-60" fill="none"
          stroke="#1c1813" stroke-width="22" stroke-linecap="round"/>
    <path d="M560,700 q40,-90 130,-110 M980,660 q-20,-90 60,-130
             M1300,640 q60,-60 150,-50" fill="none" stroke="#1c1813"
          stroke-width="14" stroke-linecap="round"/>
    <g id="peaches">
      <circle cx="600" cy="560" r="34" fill="#c0392b" opacity="0.92"/>
      <circle cx="980" cy="500" r="30" fill="#c0392b" opacity="0.85"/>
      <circle cx="1380" cy="560" r="36" fill="#c0392b" opacity="0.9"/>
      <circle cx="1180" cy="600" r="26" fill="#c0392b" opacity="0.8"/>
      <circle cx="420" cy="640" r="26" fill="#c0392b" opacity="0.85"/>
    </g>
    <text x="960" y="380" font-size="42" fill="#4a4238" text-anchor="middle"
          opacity="0.9">九千年一熟,吃了与天地同寿 —— 让猴子看桃园?</text>
  </g>

  <!-- 幕5:大战天兵 -->
  <g id="sg-war" opacity="0">
    <g stroke="#1c1813" fill="none" stroke-linecap="round">
      <path d="M420,300 q220,180 520,430" stroke-width="16"/>
      <path d="M1500,280 q-240,200 -540,440" stroke-width="16"/>
      <path d="M360,620 q300,-60 600,-40 M1560,560 q-300,-60 -620,20"
            stroke-width="10" opacity="0.75"/>
    </g>
    <g fill="#c0392b">
      <circle cx="955" cy="505" r="14"/><circle cx="820" cy="420" r="9"/>
      <circle cx="1090" cy="600" r="9"/><circle cx="700" cy="560" r="7"/>
    </g>
    <text x="960" y="180" font-size="48" fill="#2a251d" text-anchor="middle"
          letter-spacing="10">十万天兵 · 天罗地网</text>
    <text x="960" y="920" font-size="38" fill="#9a3412" text-anchor="middle"
          opacity="0.92">四大天王、二十八宿 —— 没人是他对手</text>
  </g>

  <!-- 幕6:二郎神 -->
  <g id="sg-erlang" opacity="0">
    <g transform="translate(560,470)" fill="#1c1813">
      <rect x="-10" y="-260" width="20" height="520" rx="10"/>
      <path d="M-60,-260 h120 l-18,42 h-84 z"/>
      <path d="M-58,-218 h116 l-16,40 h-84 z"/>
      <circle cx="0" cy="-290" r="16"/>
    </g>
    <g transform="translate(1360,470)">
      <rect x="-9" y="-240" width="18" height="480" rx="9" fill="#1c1813"
            transform="rotate(16)"/>
      <circle cx="0" cy="-252" r="14" fill="#1c1813"/>
    </g>
    <g stroke="#c0392b" stroke-width="8" opacity="0.9">
      <path d="M760,430 l70,-16 M750,470 l80,10 M770,390 l60,-30"/>
    </g>
    <text x="960" y="180" font-size="48" fill="#2a251d" text-anchor="middle"
          letter-spacing="10">你变麻雀,我变饿鹰 · 变化斗法</text>
    <text x="960" y="900" font-size="38" fill="#9a3412" text-anchor="middle"
          opacity="0.92">金刚琢暗算 —— 大圣被擒</text>
  </g>

  <!-- 幕7:八卦炉 -->
  <g id="sg-furnace" opacity="0">
    <path d="M760,470 h400 l-40,300 q-160,60 -320,0 z" fill="#3b352c"/>
    <ellipse cx="960" cy="470" rx="200" ry="42" fill="#1c1813"/>
    <rect x="770" y="770" width="50" height="90" rx="16" fill="#1c1813"/>
    <rect x="1100" y="770" width="50" height="90" rx="16" fill="#1c1813"/>
    <g fill="#c0392b" opacity="0.92">
      <path d="M900,430 q-16,-70 20,-120 q4,60 36,86 q10,-40 44,-58
               q-4,66 -30,92 z"/>
      <path d="M1000,430 q20,-56 60,-72 q-4,52 -34,80 z" opacity="0.8"/>
    </g>
    <text x="960" y="380" font-size="40" fill="#9a3412" text-anchor="middle"
          letter-spacing="8">四十九日 · 八卦炉</text>
    <g fill="#d4a017" opacity="0.95">
      <circle cx="918" cy="620" r="16" filter="url(#glow)"/>
      <circle cx="1002" cy="620" r="16" filter="url(#glow)"/>
    </g>
    <text x="960" y="920" font-size="38" fill="#9a3412" text-anchor="middle"
          opacity="0.92">炉火炼出 —— 火眼金睛</text>
  </g>

  <!-- 幕8:如来赌局 -->
  <g id="sg-buddha" opacity="0">
    <g fill="#3b352c" opacity="0.95">
      <path d="M420,1080 L470,560 q10,-70 50,-70 q40,0 50,70 l30,520 z"/>
      <path d="M640,1080 L660,480 q8,-78 52,-78 q44,0 52,78 l30,600 z"/>
      <path d="M880,1080 L880,440 q10,-90 60,-90 q50,0 60,90 l20,640 z"/>
      <path d="M1120,1080 L1150,500 q10,-74 52,-74 q42,0 50,74 l40,580 z"/>
      <path d="M1340,1080 L1390,600 q12,-66 52,-66 q40,0 48,68 l60,478 z"/>
    </g>
    <circle cx="935" cy="240" r="46" fill="none" stroke="#c0392b"
            stroke-width="7"/>
    <text x="935" y="140" font-size="36" fill="#7c2d12" text-anchor="middle"
          opacity="0.95">一个筋斗十万八千里 · 翻不出五指山</text>
    <text x="700" y="1020" font-size="28" fill="#efe7d3" opacity="0.9"
          letter-spacing="4">齐天大圣 · 到此一游</text>
  </g>

  <!-- 幕9:五行山 -->
  <g id="sg-mountain" opacity="0">
    <path d="M160,1080 L520,360 Q560,290 640,300 L700,320 L760,300
             Q840,290 880,360 L1240,1080 Z" fill="#3b352c"
          filter="url(#inkblur2)"/>
    <rect x="620" y="330" width="120" height="200" fill="#d4a017"
          opacity="0.95" transform="rotate(3 680 430)"/>
    <text x="680" y="395" font-size="34" fill="#5b3600" text-anchor="middle"
          writing-mode="tb" letter-spacing="6">唵嘛呢叭咪吽</text>
    <path d="M820,1010 q30,-90 -20,-170 l40,10 q30,80 10,160 z"
          fill="#1c1813"/>
    <text x="960" y="240" font-size="44" fill="#2a251d" text-anchor="middle"
          letter-spacing="10" opacity="0.95">五百年后,取经的故事开始</text>
  </g>

  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.55"/>
</svg>

<div id="subwrap"></div>
<div id="brand">西游记 · 第一部 · 大闹天宫</div>
<div id="part"></div>
<div id="pbar"><div id="pfill"></div></div>

<script>
window.__DATA__=__DATA_JSON__;window.__CONTENT__=__CONTENT_JSON__;
</script>
<script>
const DATA=window.__DATA__, SEGS=DATA.segments, DUR=DATA.duration;
const $=id=>document.getElementById(id);
const clamp01=v=>Math.max(0,Math.min(1,v));
const easeOut=k=>1-Math.pow(1-k,3);

/* 场景容器映射 */
const SCENE_OF=SEGS.map(s=>s.scene);
const GROUPS={};
SCENE_OF.forEach((n,i)=>{
  const g=$('sg-'+n);
  if(g && !GROUPS[n]) GROUPS[n]=g;
});

/* 字幕 */
const subwrap=$('subwrap'); const cues=[];
for(const seg of SEGS) for(const c of seg.cues){
  const div=document.createElement('div'); div.className='cue';
  div.textContent=c.text; subwrap.appendChild(div);
  cues.push({div,start:c.start,end:c.end});
}
let activeCue=null;
function drawSub(t){
  let hit=null;
  for(const c of cues) if(t>=c.start&&t<=c.end){hit=c;break;}
  if(hit!==activeCue){
    if(activeCue) activeCue.div.style.display='none';
    if(hit) hit.div.style.display='block';
    activeCue=hit;
  }
}

/* 共享底景的显隐策略:某些幕不要红日/远山 */
const HIDE={dragon:['bgSun'],furnace:['bgSun','bgClouds'],
            buddha:['bgClouds'],mountain:['bgSun','bgClouds']};

const clouds=$('bgClouds');
function sceneProg(t,seg){return clamp01((t-seg.start)/(seg.end-seg.start));}

const PAINT={
 title(seg,p){
   $('ttMark').style.opacity=(easeOut(clamp01(p*1.8))*0.92).toFixed(3);
   const sub=$('ttSub'); sub.style.opacity=clamp01((p-0.3)*3).toFixed(3);
 },
 dragon(seg,p){
   const g=$('sg-dragon');
   g.querySelector('rect').style.opacity=(easeOut(clamp01(p*1.4))).toFixed(3);
 },
 gate(seg,p){},
 flag(seg,p){
   const f=$('sg-flag').querySelector('path');
   const k=easeOut(clamp01((p-0.05)*1.8));
   f.setAttribute('opacity',(k*0.94).toFixed(3));
 },
 peach(seg,p){
   const ps=[...document.querySelectorAll('#peaches circle')];
   ps.forEach((c,i)=>{
     const k=clamp01((p-0.2-i*0.12)*2.6);
     c.style.opacity=(k*0.9).toFixed(3);
     c.setAttribute('cy',String(parseFloat(c.getAttribute('cy'))));
   });
 },
 war(seg,p){
   const ls=[...$('sg-war').querySelectorAll('path')];
   ls.forEach((l,i)=>{
     const k=clamp01((p-0.1-i*0.13)*3);
     l.style.opacity=(k*(i<2?1:0.75)).toFixed(3);
   });
 },
 erlang(seg,p){},
 furnace(seg,p){
   const fires=[...$('sg-furnace').querySelectorAll('path')];
   fires.forEach((f,i)=>{
     const k=clamp01((p-0.3-i*0.18)*3);
     f.style.opacity=(k*0.92).toFixed(3);
   });
 },
 buddha(seg,p){
   const parts=[...$('sg-buddha').querySelectorAll('path')];
   parts.forEach((pt,i)=>{
     const k=clamp01((p-0.06-i*0.09)*2.8);
     pt.style.opacity=(k*0.95).toFixed(3);
   });
 },
 mountain(seg,p){
   const m=$('sg-mountain').querySelector('path');
   const k=easeOut(clamp01((p-0.05)*1.6));
   m.style.opacity=k.toFixed(3);
   m.setAttribute('transform',`translate(0,${(1-k)*220})`);
 },
};

let shown=null;
function pickSeg(t){
  for(const s of SEGS) if(t>=s.start-0.2&&t<=s.end+0.45) return s;
  return t>=SEGS[SEGS.length-1].end?SEGS[SEGS.length-1]:null;
}
window.renderFrame=function(t){
  const seg=pickSeg(t);
  const key=seg?seg.scene:null;
  if(key!==shown){
    Object.entries(GROUPS).forEach(([k,g])=>{
      g.style.display=(k===key)?'':'none';
      if(k===key) g.style.opacity=1;
    });
    (HIDE[key]||[]).forEach(id=>{ if(GROUPS[key]&&$(id)) $(id).style.opacity=0; });
    if(shown && HIDE[shown]) (HIDE[shown]||[]).forEach(id=>{ if($(id)) $(id).style.opacity=1; });
    shown=key;
  }
  if(seg){
    $('part').textContent=`第 ${seg.pos+1} 幕 / ${SEGS.length} · ${seg.label}`;
    PAINT[seg.scene](seg,sceneProg(t,seg));
  }
  $('pfill').style.width=(t/DUR*100).toFixed(2)+'%';
  drawSub(t);
};
document.fonts.ready.then(()=>{window.__READY__=true;});
renderFrame(0);
</script>
</body>
</html>
