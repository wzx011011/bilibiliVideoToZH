<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden;
              font-family:"STKaiti","KaiTi","Microsoft YaHei",serif; }
</style>
</head>
<body>
<svg id="sc" width="1920" height="1080" viewBox="0 0 1920 1080"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="paper" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#f7f2e6"/>
      <stop offset="70%" stop-color="#efe7d3"/>
      <stop offset="100%" stop-color="#e6dcc4"/>
    </radialGradient>
    <linearGradient id="mist1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9b2a0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#b9b2a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f8776" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#8f8776" stop-opacity="0"/>
    </linearGradient>
    <filter id="inkblur"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="inkblur2"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"
                    result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.35 0 0 0 0 0.32 0 0 0 0 0.26 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#paper)"/>

  <!-- 红日 -->
  <circle cx="1430" cy="300" r="150" fill="#c0392b" opacity="0.92"
          filter="url(#inkblur2)"/>

  <!-- 远山(淡墨) -->
  <path d="M0,700 Q240,540 480,660 Q700,760 900,640 Q1150,500 1400,680
           Q1650,830 1920,690 L1920,1080 L0,1080 Z"
        fill="#a49c8a" opacity="0.5" filter="url(#inkblur)"/>
  <path d="M0,800 Q320,640 640,780 Q960,900 1280,760 Q1560,650 1920,800
           L1920,1080 L0,1080 Z"
        fill="#7d7563" opacity="0.62" filter="url(#inkblur)"/>

  <!-- 祥云(勾线) -->
  <g stroke="#4a4238" stroke-width="5" fill="#efe7d3" opacity="0.85"
     filter="url(#inkblur2)" id="clouds">
    <path d="M180,330 q60,-70 140,-40 q40,-60 120,-30 q70,20 50,70
             q80,-10 70,50 l-330,10 q-60,-20 -50,-60 z"/>
    <path d="M1180,180 q50,-55 110,-30 q35,-45 95,-20 q55,18 40,55
             q60,-5 52,40 l-260,8 q-48,-16 -37,-53 z" opacity="0.8"/>
  </g>

  <!-- 中景山(浓墨) -->
  <path d="M-60,960 Q340,760 760,920 Q1180,1060 1980,880 L1980,1080 L-60,1080 Z"
        fill="#3b352c" filter="url(#inkblur2)"/>

  <!-- 悟空剪影(立于峰顶) -->
  <g id="wukong" fill="#1c1813" transform="translate(940,690)">
    <!-- 尾巴:从身后卷起 -->
    <path d="M-24,-150 q-70,-14 -96,-72 q-18,-44 12,-84 q-12,52 22,84
             q26,24 74,30 z"/>
    <!-- 后腿(踏石) -->
    <path d="M-26,-158 q-30,44 -26,96 q-2,26 10,44 l26,0 q-16,-30 -6,-74
             q8,-36 22,-56 z"/>
    <!-- 前腿(弓步) -->
    <path d="M4,-156 q30,40 30,92 q0,30 -12,48 l30,0 q14,-40 4,-90
             q-10,-44 -28,-66 z"/>
    <!-- 披风(身后飘) -->
    <path d="M-10,-268 q-58,40 -74,120 q28,-22 56,-30 q10,-52 34,-74 z"/>
    <!-- 躯干 -->
    <path d="M-22,-262 q-16,60 -12,116 q22,20 48,4 q16,-64 4,-118 z"/>
    <!-- 搭凉棚的手臂 -->
    <path d="M-2,-248 q28,-30 58,-34 l4,16 q-30,2 -50,30 z"/>
    <!-- 头(侧脸朝左,有吻部) -->
    <circle cx="6" cy="-292" r="27"/>
    <ellipse cx="-16" cy="-284" rx="14" ry="10"/>
    <!-- 紧箍(额上一圈) -->
    <path d="M-20,-302 q26,-14 52,0 l0,9 q-26,-13 -52,0 z"
          fill="none" stroke="#1c1813" stroke-width="8"/>
    <!-- 金箍棒扛肩 -->
    <g transform="rotate(38 -6 -240)">
      <rect x="-9" y="-320" width="16" height="640" rx="8"/>
      <rect x="-15" y="-328" width="28" height="30" rx="7"/>
      <rect x="-15" y="298" width="28" height="30" rx="7"/>
      <rect x="-9" y="-320" width="16" height="640" rx="8" fill="none"
            stroke="#efe7d3" stroke-width="3" stroke-dasharray="16 34"
            opacity="0.75"/>
    </g>
  </g>
  <!-- 题字与印章 -->
  <text x="1720" y="170" font-size="92" fill="#2a251d"
        writing-mode="tb" letter-spacing="14" opacity="0.9">西游记</text>
  <rect x="1682" y="560" width="74" height="74" fill="#c0392b" opacity="0.9"/>
  <text x="1698" y="612" font-size="34" fill="#f7f2e6"
        font-family="STKaiti,KaiTi">第一回</text>
  <text x="120" y="980" font-size="40" fill="#4a4238" opacity="0.75"
        letter-spacing="6">第一回 · 石猴出世 —— 花果山巅,望见的是整个天庭</text>

  <!-- 纸张颗粒 -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.6"/>
</svg>

<script>
/* 轻微动效:云漂移 + 披风呼吸(逐帧确定性) */
const clouds=document.querySelector('#clouds');
const wk=document.querySelector('#wukong');
window.renderFrame=function(t){
  clouds.setAttribute('transform',`translate(${(t*6)%80-40},0)`);
  wk.setAttribute('transform',
    `translate(940,690) rotate(${Math.sin(t*1.4)*1.2})`);
};
window.__READY__=true;
</script>
</body>
</html>
