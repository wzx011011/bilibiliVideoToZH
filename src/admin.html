<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多流水线视频制作管理</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { font-family: "Microsoft YaHei", sans-serif; font-size: 14px; color: #1f2937; margin: 0; padding: 20px; background: #f3f4f6; }
h1 { font-size: 22px; margin: 0 0 5px; }
h2 { font-size: 16px; margin: 0 0 12px; color: #374151; }
.hint { color: #6b7280; font-size: 13px; }
.refresh-indicator { font-size: 12px; color: #9ca3af; margin-left: 12px; }
.card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.pipes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.pipe { border: 2px solid #e5e7eb; border-radius: 8px; padding: 14px; cursor: pointer; transition: all .15s; }
.pipe:hover { border-color: #93c5fd; }
.pipe.active { border-color: #2563eb; background: #eff6ff; }
.pipe-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
.pipe-dims { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.dim { font-size: 11px; background: #f3f4f6; border-radius: 4px; padding: 2px 8px; color: #4b5563; }
.pipe-desc { font-size: 12px; color: #6b7280; line-height: 1.5; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 12px 0; }
.field label { display: block; font-size: 12px; color: #4b5563; margin-bottom: 4px; font-weight: 600; }
.field input { width: 100%; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; }
.field .req { color: #dc2626; }
.field .tip { font-size: 11px; color: #9ca3af; margin-top: 3px; }
.btn { padding: 6px 14px; border: 0; border-radius: 5px; cursor: pointer; font-size: 13px; background: #e5e7eb; color: #1f2937; }
.btn:hover { background: #d1d5db; }
.btn.primary { background: #2563eb; color: #fff; }
.btn.primary:hover { background: #1d4ed8; }
.btn.warn { background: #d97706; color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.task { border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
.task-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.task-name { font-weight: 700; font-size: 15px; }
.badge { font-size: 11px; padding: 2px 10px; border-radius: 10px; color: #fff; }
.badge.running { background: #2563eb; }
.badge.waiting_user { background: #d97706; animation: pulse 1.5s infinite; }
.badge.done { background: #047857; }
.badge.failed { background: #b91c1c; }
.pipeline-tag { font-size: 12px; color: #6b7280; }
.stages { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 8px; }
.stage { font-size: 12px; padding: 4px 10px; border-radius: 12px; border: 1px solid #e5e7eb; color: #9ca3af; display: flex; align-items: center; gap: 5px; }
.stage.done { border-color: #a7f3d0; background: #ecfdf5; color: #047857; }
.stage.running { border-color: #bfdbfe; background: #eff6ff; color: #2563eb; animation: pulse 1.5s infinite; }
.stage.waiting_user { border-color: #fde68a; background: #fffbeb; color: #b45309; }
.stage.failed { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
.manual-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 10px 12px; font-size: 13px; margin: 8px 0; line-height: 1.7; }
.products { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.product { font-size: 12px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 5px; padding: 4px 10px; }
.err { color: #b91c1c; font-size: 12px; margin-top: 6px; white-space: pre-wrap; }
details log, details pre { margin-top: 8px; }
pre.log { background: #111827; color: #d1d5db; font-size: 11px; line-height: 1.5; padding: 10px; border-radius: 6px; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.toast { position: fixed; top: 20px; right: 20px; background: #047857; color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.15); display: none; z-index: 999; }
.toast.error { background: #b91c1c; }
.empty { color: #9ca3af; text-align: center; padding: 30px; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
</style>
</head>
<body>

<div class="card">
  <h1>多流水线视频制作管理</h1>
  <span class="hint">统一产物:封面 + 中文配音 + 中文字幕 → MP4;差异在三类资源的生成方式(源语言 × 字幕来源 × 说话人)</span>
  <span class="refresh-indicator" id="refresh-time"></span>
</div>

<div class="card">
  <h2>① 选择流水线</h2>
  <div class="pipes" id="pipes"></div>
  <div id="form-area" style="display:none">
    <h2 style="margin-top:18px">② 新建任务</h2>
    <div class="form-grid" id="form-fields"></div>
    <button class="btn primary" id="create-btn" onclick="createTask()">创建并开始</button>
  </div>
</div>

<div class="card">
  <h2>任务列表</h2>
  <div id="tasks"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let PIPELINES = [];
let selected = null;
let tasks = [];

async function loadPipelines() {
  const r = await fetch('/api/pipelines');
  PIPELINES = Object.values(await r.json());
  renderPipes();
}

function renderPipes() {
  document.getElementById('pipes').innerHTML = PIPELINES.map(p => {
    const dims = [
      p.dims.lang === 'en' ? '英文源' : '中文源',
      p.dims.subtitle_source === 'ocr' ? '画面硬字幕' : '语音转写',
      p.dims.speakers > 1 ? '多人物' : '单人'
    ];
    return `<div class="pipe ${selected===p.key?'active':''}" onclick="selectPipe('${p.key}')">
      <div class="pipe-name">${p.name}</div>
      <div class="pipe-dims">${dims.map(d=>`<span class="dim">${d}</span>`).join('')}</div>
      <div class="pipe-desc">${p.desc}</div>
    </div>`;
  }).join('');
}

function selectPipe(key) {
  selected = key;
  renderPipes();
  const p = PIPELINES.find(x => x.key === key);
  document.getElementById('form-area').style.display = 'block';
  document.getElementById('form-fields').innerHTML = p.params.map(f => `
    <div class="field">
      <label>${f.label}${f.required?' <span class="req">*</span>':''}</label>
      <input id="param-${f.key}" placeholder="${f.hint||''}">
    </div>`).join('');
}

async function createTask() {
  const p = PIPELINES.find(x => x.key === selected);
  const params = {};
  for (const f of p.params) {
    const v = document.getElementById('param-' + f.key).value.trim();
    if (v) params[f.key] = v;
  }
  const r = await fetch('/api/tasks', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ pipeline: selected, params })
  });
  const d = await r.json();
  if (d.ok) { showToast('任务已创建,自动阶段开始执行'); fetchTasks(); }
  else showToast(d.error || '创建失败', true);
}

async function fetchTasks() {
  try {
    const r = await fetch('/api/tasks');
    tasks = await r.json();
    renderTasks();
    document.getElementById('refresh-time').textContent = '更新于 ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('tasks').innerHTML = '<div class="empty">连接失败: ' + e.message + '</div>';
  }
}

const STATUS_CN = { running:'执行中', waiting_user:'等你操作', done:'完成', failed:'失败' };
const STAGE_ICON = { pending:'·', running:'⏳', waiting_user:'👤', done:'✓', failed:'✗' };

function renderTasks() {
  const box = document.getElementById('tasks');
  if (!tasks.length) { box.innerHTML = '<div class="empty">还没有任务,先在上面选流水线创建</div>'; return; }
  box.innerHTML = tasks.map(t => {
    const pipe = PIPELINES.find(p => p.key === t.pipeline);
    const stages = t.stages.map(s =>
      `<span class="stage ${s.status}" title="${s.status}">${STAGE_ICON[s.status]} ${s.label}</span>`).join('');
    let manual = '';
    if (t.status === 'waiting_user') {
      const ws = t.stages.find(s => s.status === 'waiting_user');
      manual = `<div class="manual-box">👤 <b>需要你操作:</b>在浏览器扩展中选择任务的 chunks 目录(manifest.json + 全部 TXT)并发送。
        页面每 3 秒自动检测发送记录(doubao-send.json),全部发送成功会自动继续;
        也可以 <a href="#" onclick="doAction('${t.id}','confirm_send');return false">手动确认已发送</a>。</div>`;
    }
    let actions = '';
    if (t.status === 'failed') actions = `<button class="btn warn" onclick="doAction('${t.id}','retry')">重试失败阶段</button>`;
    if (t.status === 'waiting_user') actions = `<button class="btn" onclick="doAction('${t.id}','confirm_send')">我已发送完成</button>`;
    const products = Object.entries(t.products || {}).map(([k,v]) =>
      `<span class="product">${k==='audio'?'音频':k==='subtitle'?'字幕':k==='video'?'视频':'分块'}: ${v}</span>`).join('');
    return `<div class="task">
      <div class="task-head">
        <span class="task-name">${t.name}</span>
        <span class="badge ${t.status}">${STATUS_CN[t.status]}</span>
        <span class="pipeline-tag">${pipe ? pipe.name : t.pipeline} · ${t.created_at}</span>
        <span style="flex:1"></span>${actions}
      </div>
      <div class="stages">${stages}</div>
      ${manual}
      ${products ? `<div class="products">${products}</div>` : ''}
      ${details(t)}
    </div>`;
  }).join('');
}

function details(t) {
  return `<details ontoggle="loadDetail('${t.id}', this)"><summary class="hint" style="cursor:pointer">运行日志</summary><pre class="log" id="log-${t.id}">加载中...</pre></details>`;
}

async function loadDetail(id, el) {
  if (!el.open) return;
  const r = await fetch('/api/tasks/' + id);
  const d = await r.json();
  const pre = document.getElementById('log-' + id);
  if (pre) pre.textContent = (d.log || []).join('\n') || '(暂无日志)';
}

async function doAction(id, action) {
  const r = await fetch(`/api/tasks/${id}/action`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ action })
  });
  const d = await r.json();
  if (d.ok) showToast('已执行'); else showToast(d.error || '操作失败', true);
  setTimeout(fetchTasks, 800);
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 3000);
}

loadPipelines().then(fetchTasks);
setInterval(fetchTasks, 3000);
</script>
</body>
</html>
