<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { width: 460px; max-height: 680px; overflow-y: auto; font-family: "Microsoft YaHei", sans-serif; font-size: 13px; color: #1f2937; margin: 0; padding: 14px 16px; background: #fff; }
h1 { font-size: 17px; margin: 0 0 3px; }
h2 { font-size: 14px; margin: 0 0 9px; }
.hint { color: #6b7280; font-size: 12px; line-height: 1.55; margin: 0 0 10px; }
.section { border-top: 1px solid #e5e7eb; padding-top: 13px; margin-top: 13px; }
.field-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.field-row label { width: 84px; color: #4b5563; }
input[type="file"] { width: 100%; font-size: 12px; }
input[type="number"] { width: 76px; padding: 5px 7px; border: 1px solid #d1d5db; border-radius: 4px; }
.selected { max-height: 72px; overflow-y: auto; padding: 7px 8px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 4px; color: #4b5563; font: 11px/1.45 Consolas, monospace; white-space: pre-wrap; }
.status-line { display: flex; justify-content: space-between; gap: 10px; margin: 9px 0 5px; }
.status-label { font-weight: 600; }
.error { color: #b91c1c; }
.ok { color: #047857; font-weight: 700; }
.miss { color: #b91c1c; }
progress { width: 100%; height: 12px; }
.buttons { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
button { min-width: 78px; flex: 1; padding: 7px 9px; border: 0; border-radius: 4px; cursor: pointer; font-size: 12px; background: #e5e7eb; color: #1f2937; }
button.primary { background: #2563eb; color: #fff; }
button.danger { background: #fee2e2; color: #991b1b; }
button:disabled { cursor: not-allowed; opacity: .45; }
.probe { min-height: 18px; color: #4b5563; font-size: 11px; margin-top: 7px; }
.log { max-height: 112px; overflow-y: auto; padding: 7px 8px; margin-top: 8px; background: #111827; color: #d1fae5; border-radius: 4px; font: 11px/1.5 Consolas, monospace; white-space: pre-wrap; }
details summary { cursor: pointer; font-weight: 600; }
table { width: 100%; border-collapse: collapse; margin: 8px 0; }
td { padding: 4px 5px; border-bottom: 1px solid #eee; vertical-align: middle; }
td.state { width: 22px; text-align: center; }
td.field { width: 125px; color: #4b5563; white-space: nowrap; }
td.value { max-width: 250px; overflow: hidden; color: #047857; font: 11px Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
td.value.missing { color: #b91c1c; }
.toast { display: none; color: #047857; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<h1>豆包课程配音助手</h1>
<p class="hint">在当前已登录的豆包对话中，按顺序发送字幕分块；Popup 关闭后队列仍会继续。</p>

<section class="section">
  <h2>分块发送</h2>
  <input id="queue-files" type="file" accept=".txt,.json,text/plain,application/json" multiple>
  <p class="hint">推荐同时选择 <code>manifest.json</code> 和其中列出的全部 TXT，扩展会拒绝缺失或额外分块。</p>
  <div id="selected-files" class="selected">尚未选择文件</div>
  <div class="field-row">
    <label for="send-delay">块间等待</label>
    <input id="send-delay" type="number" value="5" min="1" max="60" step="1">
    <span>秒</span>
  </div>
  <div class="status-line">
    <span id="sender-status" class="status-label">空闲</span>
    <span id="sender-progress">0 / 0</span>
  </div>
  <progress id="sender-bar" max="1" value="0"></progress>
  <div id="sender-error" class="hint error"></div>
  <div class="buttons">
    <button id="probe">检测页面</button>
    <button id="start" class="primary">开始发送</button>
    <button id="pause">暂停</button>
    <button id="resume">重试/继续</button>
    <button id="skip">跳过当前</button>
    <button id="stop" class="danger">停止</button>
    <button id="export">导出记录</button>
  </div>
  <div id="probe-result" class="probe"></div>
  <div id="sender-log" class="log">暂无发送日志</div>
</section>

<details class="section">
  <summary>朗读凭据</summary>
  <p class="hint">缺少 appkey 时，在豆包点击任意回复的“朗读”。其它字段随页面请求自动更新。</p>
  <table><tbody id="fields"></tbody></table>
  <div class="buttons">
    <button id="refresh">刷新凭据</button>
    <button id="copy" class="primary">复制 .env</button>
  </div>
  <div class="toast" id="toast">已复制到剪贴板</div>
</details>

<script src="sender-core.js"></script>
<script src="popup.js"></script>
</body>
</html>
